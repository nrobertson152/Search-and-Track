name: AppImage

# Builds the x86_64 AppImage on every pull request and push to main (download it from the
# run's artifacts), and on a version tag (v1.2.3) attaches it to a draft GitHub release
# for the owner to review and publish.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: meta
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$base" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $base in pyproject.toml"
              exit 1
            fi
          else
            version="$base-dev.${COMMIT:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Packaging tools
        run: sudo apt-get update -q && sudo apt-get install -y -q desktop-file-utils file

      - uses: actions/cache@v5
        with:
          path: build/appimage/cache
          key: appimage-downloads-${{ hashFiles('tools/build_appimage.sh') }}

      - name: Build and smoke-test
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: tools/build_appimage.sh

      - uses: actions/upload-artifact@v6
        with:
          name: SearchAndTrack-${{ steps.meta.outputs.version }}-x86_64
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v6
        with:
          name: smoke-test-screenshots
          path: build/appimage/smoke-*.png

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: SearchAndTrack-*
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Search and Track $version" > notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "Search and Track ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
