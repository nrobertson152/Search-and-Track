name: CI

on:
  push:
    branches: [main, vertical-slice]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Manual mirror is current
        run: python tools/sync_manual.py --check
      - name: Tests
        run: python -m pytest -q
      - name: Headless screenshot smoke run
        run: |
          python -m searchtrack --screenshot shot.png --scenario us_training_intercept --seconds 120
          python -m searchtrack --screenshot shot_su.png --scenario su_may_day --seconds 600
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-py${{ matrix.python }}
          path: shot*.png
