1. ENEMY STRIKE ACROSS THE BALTIC 2330-0040. MISSILE BATTALIONS AND AIRFIELDS OF THE LENINGRAD DIRECTION HEAVILY DAMAGED.
2. ENEMY AIRCRAFT DESTROYED: {kills}. OWN LOSSES: {lost}.
