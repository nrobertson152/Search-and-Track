1. ENEMY STRIKE ACROSS THE BALTIC 2330-0040. F-111, F-4G, EF-111, F-15, CRUISE MISSILES FROM B-52.
2. ENEMY AIRCRAFT DESTROYED: {kills}. OWN LOSSES: {lost}.
3. THE AIR DEFENSE OF LENINGRAD REMAINS INTACT.
"""

