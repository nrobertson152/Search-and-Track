[[mission]]
scenario = "su_battle_moscow"
title = "The Capital"

[[mission.page]]
at = "before"
kind = "teletype"
title = "TO ALL COMMANDS"
from = "Ministry of Defence of the USSR"
to = "All fronts, fleets and armies"
date = "23 October 1987, 0400"
text = """
1. THE GOVERNMENTS OF THE USSR AND THE USA HAVE AGREED ON A CEASEFIRE ON ALL FRONTS FROM 0700 MOSCOW TIME 23 OCTOBER 1987.
2. FROM 0700 ALL COMBAT ACTIONS ARE TO CEASE. ONLY WEAPONS ALREADY IN FLIGHT MAY BE ENGAGED.
3. ANY USE OF WEAPONS AFTER 0700 WITHOUT THE ORDER OF THE CENTRAL COMMAND POST WILL BE INVESTIGATED.
"""

[[mission.page]]
at = "before"
kind = "letter"
title = "A LETTER HOME"
from = "{soldier}"
to = "{mother}"
date = "23 October 1987"
text = """
Dear Mama,

The radio says it will stop at seven o'clock tomorrow morning. Everyone in the company is pretending not to count the hours.

Major Volkova left for Leningrad with the colonel. Before she left she gave me her pen, because mine is broken, and said to write to you every day until I am home. So I am writing.

One more night, they say. The Americans will try once more before it ends. I will be at my screen.

Your son, Ruslan
"""

# ====================================================================== 5 — the capital

[[mission.page]]
at = "after"
when = "mercy"
kind = "report"
title = "REPORT"
from = "Commander, 656th Fighter Regiment, Tapa"
date = "{date}"
text = """
07:21. A pair of MiG-23s escorted the damaged American B-52 westward across Estonia at a distance of two kilometres until it crossed the state border over the Baltic Sea at 07:38. The bomber was flying on three engines with a fuel leak from the right wing.

At the border its crew rocked the wings. My leader, Captain Belov, rocked his in reply. I request that he not be punished for this.

The bomber's crew of six was picked up by a Swedish ship after ditching near Gotland at 08:02. All alive.
"""

[[mission.page]]
at = "after"
when = "hard"
kind = "diary"
title = "FROM THE DUTY LOG"
from = "{officer}"
date = "{date}"
text = """
07:14. Permission was given, and the B-52 came down over Estonia, fourteen minutes after the ceasefire. Six men.

The Americans have already protested. The Central Command Post has asked for the name of the officer who gave the order. The colonel gave them his own.

It had fired at us an hour earlier. I tell myself that.
"""

# ====================================================================== the end

[[epilogue]]
when = "war_victory"
kind = "newspaper"
title = "THE NORTHERN SENTRY"
from = "Newspaper of the 10th Air Defense Army"
date = "24 October 1987"
text = """
THE SKY OVER THE MOTHERLAND IS CLEAR

For four days the soldiers of the Air Defense Forces met the blows of the aggressor from the Barents Sea to the approaches of the capital, and not one enemy aircraft reached Moscow.

The best fighter pilot of the war is {ace} of {ace_unit}, with {ace_kills} victories. He is to be presented for the title of Hero of the Soviet Union.
"""

[[epilogue]]
when = "war_draw"
kind = "newspaper"
title = "THE NORTHERN SENTRY"
from = "Newspaper of the 10th Air Defense Army"
date = "24 October 1987"
text = """
THE CEASEFIRE

The guns are silent. The shield held, at a price that the newspaper is not yet permitted to print. The radar companies are already rebuilding what was destroyed.

The best fighter pilot of the war: {ace}, {ace_kills} victories.
"""

[[epilogue]]
when = "war_defeat"
kind = "diary"
title = "FROM THE DUTY LOG"
from = "{officer}"
date = "24 October 1987"
text = """
The ceasefire found the north-west with half its radars destroyed and its regiments at a third of their strength. If it had lasted two more days, I do not know what would have stood between the Americans and Moscow.

General Krylov has been called to Moscow. Nobody knows whether to congratulate him or to say goodbye.
"""

[[epilogue]]
when = "mercy_4"
kind = "letter"
title = "A LETTER, YEARS LATER"
from = "Via the Embassy of the United States"
to = "The Command of the Air Defense of the Russian Federation"
date = "May 1992"
text = """
Gentlemen,

On the morning of 23 October 1987 I was the aircraft commander of a B-52G with three engines and not enough fuel, over Estonia, fourteen minutes after the ceasefire. Two of your MiG-23s came up beside us. I told my crew to get ready to eject.

They escorted us to the coast instead, two kilometres off our wing, and at the border the leader rocked his wings. I rocked mine. We went into the sea off Gotland an hour later and all six of us came home.

I would like to find that pilot. I would like to shake his hand. I have been waiting five years to be allowed to ask.
"""

[[epilogue]]
when = "mercy_0"
kind = "letter"
title = "A LETTER, YEARS LATER"
from = "Via the Embassy of the United States"
to = "The Command of the Air Defense of the Russian Federation"
date = "May 1992"
text = """
Gentlemen,

In October 1987 I flew a reconnaissance aircraft off your northern coast, and on the night the war began your fighters were close enough to us that I could see the pilot's face. Then they turned away.

I have never known who gave that order. I am writing to say that thirty-two men are alive because of it, and that I named my son after the pilot, whose number I wrote on my kneeboard that night: 602.

If he is still flying, tell him an old Rivet Joint crew would be honoured to buy him a drink.
"""

[[epilogue]]
when = ["hard_0", "hard_4"]
kind = "diary"
title = "AFTERWORD"
from = "{officer}"
date = "1997"
text = """
Ten years. The archives are open now, and young historians come to ask me about the war that almost happened and lasted four days.

They ask about the RC-135, about the B-52 after seven o'clock. I tell them what the order was. I do not tell them that I knew some of those voices.

We did our duty. I believed it then. I mostly believe it still.
"""

[[epilogue]]
when = ["hard_0", "no_hard_4"]
kind = "diary"
title = "AFTERWORD"
from = "{officer}"
date = "1997"
text = """
Ten years. The archives are open now, and young historians come to ask me about the war that almost happened and lasted four days.

They ask about the RC-135 over the Barents Sea at 18:31. I tell them what the order was, and that it was correct. I do not tell them that I had listened to that aircraft's radio for four years, and that I knew some of the voices.
"""

[[epilogue]]
when = ["hard_4", "no_hard_0"]
kind = "diary"
title = "AFTERWORD"
from = "{officer}"
date = "1997"
text = """
Ten years. The archives are open now, and young historians come to ask me about the war that almost happened and lasted four days.

They ask about the B-52 over Estonia, fourteen minutes after seven o'clock. The colonel gave them his own name. He was relieved of command in December and died in 1994. I have never told anyone who really gave the permission.
"""

[[epilogue]]
kind = "letter"
title = "THE LAST LETTER"
from = "{soldier}"
to = "{mother}"
date = "24 October 1987"
text = """
Dear Mama,

It is over. At seven o'clock the sergeant came into the cabin and switched off the alarm and sat down on the floor, and we all sat with him, and nobody said anything for a long time.

This morning the sun came up over the sea for the first time in a week. It is still cold. I do not mind.

I am coming home in the spring. Tell Dilnoza I have not forgotten the hat.

Your son, Ruslan
"""
