admiral = "Rear Admiral Thomas Kessler"
cag = "Captain Frank Delaney"
intel = "Lieutenant Commander Paul Ostrowski"
sailor = "OS2 Danny Ruiz"
wife = "Carmen"
rocc = "Colonel Margaret Hale"

# ====================================================================== the opening

[[intro]]
kind = "teletype"
title = "FLASH"
from = "CINCPACFLT PEARL HARBOR HI"
to = "CTF 77.4"
date = "19 October 1987"
text = """
SECRET. IMMEDIATE.

1. NCA HAS DIRECTED DEFCON 2 EFFECTIVE 0930Z.
2. SOVIET PACIFIC FLEET SURFACE GROUPS AT SEA FROM PETROPAVLOVSK AND VLADIVOSTOK. LONG RANGE AVIATION AND NAVAL MISSILE REGIMENTS DISPERSED SINCE 11 OCT. BACKFIRE REGIMENT 568 MRAP ASSESSED READY AT ALEKSEYEVKA.
3. CTF 77.4 CONTINUE BERING SEA OPERATIONS. HOLD SOVIET NAVAL AVIATION AWAY FROM ALASKA.
4. RULES OF ENGAGEMENT UNCHANGED: WEAPONS TIGHT. NOTHING IN THIS MESSAGE AUTHORIZES THE USE OF FORCE.
5. GOD SPEED.
"""

[[intro]]
kind = "letter"
title = "A LETTER HOME"
from = "{sailor}, USS Carl Vinson"
to = "{wife}, Chula Vista, California"
date = "18 October 1987"
text = """
Carmen —

The COD takes the mail off tomorrow so I'm writing fast. We're somewhere cold. I can't say where but you can guess from the fact that I'm wearing both sweaters you packed.

Nobody tells us anything but the chiefs have stopped joking, and the Bears came out to look at us twice today. The Tomcat guys fly alongside them and wave. One of them told me the Russian tail gunner had a camera bigger than his head.

Don't watch the news. Whatever they're saying, it's not as bad as they make it sound. Kiss Mikey for me and tell him his dad works the radar that keeps the bad guys away. That's even true.

Love you more than coffee,
Danny
"""

# ====================================================================== 1 — the prologue


[[mission]]
scenario = "us_battle_prologue"
title = "Prologue — The Bear Watch"

[[mission.page]]
at = "after"
when = "hard"
kind = "diary"
title = "CAG'S NOTEBOOK"
from = "{cag}"
date = "{date}"
text = """
1535Z. The FLASH came while EAGLE 02 was sitting a hundred feet off the BEAR's wing, close enough to see the gunner's face. Thirty seconds later the BEAR was in the water.

It was the right call. That crew had been reporting our position to Anadyr for twenty minutes and the BACKFIREs would have had it within the hour. I'd sign the order again.

I'm writing it down because the kid who fired is twenty-four and he asked me in the ready room whether they got out. I told him I didn't know. I don't.

Tonight: {kills} of theirs down, {lost} of ours. The war is six hours old.
"""

[[mission.page]]
at = "after"
when = "mercy"
kind = "diary"
title = "CAG'S NOTEBOOK"
from = "{cag}"
date = "{date}"
text = """
1535Z. The FLASH came while our fighters were sitting on the BEARs' wings. The order to let them go came from the flag plot, and I passed it on myself.

The admiral hasn't said a word about it since. Neither have I. Those two crews will be in Anadyr tonight telling their colonel exactly where we are, and tomorrow night we may pay for that.

But I keep thinking about the gunner who waved at Eagle 02 this afternoon. He's home. I'm glad. I'm not sure I'm supposed to be.

Tonight: {kills} of theirs down, {lost} of ours. The war is six hours old.
"""

