SECOND RAID BEATEN OFF

For the second night running the Soviet naval air arm threw its BACKFIREs at the battle group, and for the second night running the carrier is still here. The air wing claims {kills} enemy aircraft; it lost {lost}.

{best} flew three sorties and came back with {best_kills} kills. The leading pilot of the air wing is now {ace}, with {ace_kills}.

