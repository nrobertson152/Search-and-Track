SECRET. IMMEDIATE.

1. USS MOBILE BAY (CG 53) AND USS CALLAGHAN (DDG 994), DETACHED FROM CONVOY ESCORT AT ADAK, CHOP TO CTF 77.4 EFFECTIVE 201800Z.
2. MOBILE BAY TO THE AIR DEFENSE PICKET STATION UP-THREAT. CALLAGHAN TO THE SCREEN.
