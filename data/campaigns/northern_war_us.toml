[[epilogue]]
when = "ended_early"
kind = "newspaper"
title = "THE BATTLE GROUP DAILY — LAST EDITION"
from = "Printed at Pearl Harbor"
date = "7 November 1987"
text = """
CARL VINSON LOST

The carrier went down at night in the Bering Sea with most of her crew saved by the ships of her screen. What was left of the air wing flew to Galena and King Salmon and fought on beside the Air Force's Eagles until the end.

The war ended four days after it began, at 0400Z on 23 October. The surviving ships came home to Pearl Harbor on 6 November. The crowds on the pier were silent.

The air wing's leading pilot was {ace}, with {ace_kills} kills.
"""

[[epilogue]]
when = ["vital_lost", "no_ended_early"]
kind = "newspaper"
title = "THE BATTLE GROUP DAILY — LAST EDITION"
from = "Printed at Pearl Harbor"
date = "7 November 1987"
text = """
CARL VINSON LOST ON THE LAST NIGHT

For three nights the carrier came through everything the Soviet naval air arm could send. On the fourth, in the last hours before the ceasefire, it found her. The ships of her screen took off most of her crew; her airplanes, those still flying, went to Galena.

The ceasefire came at 0400Z on 23 October. The surviving ships came home to Pearl Harbor on 6 November. The crowds on the pier were silent.

The air wing's leading pilot was {ace}, with {ace_kills} kills.
"""

[[epilogue]]
when = ["war_victory", "no_vital_lost"]
kind = "newspaper"
title = "THE BATTLE GROUP DAILY — HOMEWARD BOUND"
from = "Printed aboard USS Carl Vinson"
date = "24 October 1987"
text = """
CEASEFIRE HOLDS — BATTLE GROUP ORDERED HOME

For four days the Carl Vinson battle group held the Soviet Pacific Fleet's naval aviation away from Alaska. It met three raids that were meant to sink it, and it is still here.

The air wing's leading pilot is {ace} of {ace_unit}, with {ace_kills} kills. Admiral Kessler, asked what he would remember, said: "The faces of the ones who didn't come back. And that the ones who did, did their job."

The battle group will be in Pearl Harbor on 6 November.
"""

[[epilogue]]
when = ["war_draw", "no_vital_lost"]
kind = "newspaper"
title = "THE BATTLE GROUP DAILY — HOMEWARD BOUND"
from = "Printed aboard USS Carl Vinson"
date = "24 October 1987"
text = """
CEASEFIRE HOLDS

Four days, four battles, and a ceasefire that nobody on either side quite believes in yet. The battle group did what it was sent to do — the Soviet bombers never reached Alaska — and it paid for it.

The air wing's leading pilot is {ace}, with {ace_kills} kills. The ships are going home.
"""

[[epilogue]]
when = ["war_defeat", "no_vital_lost"]
kind = "newspaper"
title = "THE BATTLE GROUP DAILY"
from = "Printed aboard USS Carl Vinson"
date = "24 October 1987"
text = """
THE GUNS ARE SILENT

The ceasefire found the battle group battered and short of everything: aircraft, missiles, sleep. The admiral's report to Pearl Harbor is said to be four lines long.

The Soviet naval air arm did not sink the carrier. It did not have to: for the last two nights the battle group could do little but defend itself.
"""

[[epilogue]]
when = "mercy_0"
kind = "letter"
title = "A LETTER, YEARS LATER"
from = "Via the Embassy of the Russian Federation"
to = "Commander in Chief, U.S. Pacific Fleet"
date = "May 1992"
text = """
Dear Sir,

In October 1987 I was the navigator of a Tu-95RTs reconnaissance aircraft of the 304th Regiment. On the afternoon the war began, two of your fighters were flying beside us. We knew what the radio meant before our commander did. We waited for the missiles.

They did not come. Your fighters turned away, and we flew home, and we never flew against your ships again.

I do not know who gave that order. I am writing to his Navy to say that ten men are alive because of it. One of them is my son's godfather. We drink to the American fighter pilot every year on the nineteenth of October.
"""

[[epilogue]]
when = "mercy_4"
kind = "letter"
title = "A LETTER, YEARS LATER"
from = "Via the Embassy of the Russian Federation"
to = "Commander in Chief, U.S. Pacific Fleet"
date = "May 1992"
text = """
Dear Sir,

You will not know my name. In October 1987 I was an officer of naval aviation in the Pacific. On the worst night of my life an American commander let my crew live when he did not have to.

I have tried for five years to find out who he was. Now that it is possible to write such a letter, I am writing it to his Navy and hoping that it finds him.

Please tell him that four men went home to their families because of him. Please tell him that one of them has a daughter now, and that she is named for the sea.
"""

[[epilogue]]
when = ["hard_0", "hard_4"]
kind = "diary"
title = "AFTERWORD"
from = "{cag}"
date = "1997"
text = """
Ten years. People ask me what it was like and I tell them about the airplanes, because that is what they want to hear.

I don't tell them about the BEAR at 1535Z, or the BACKFIRE after the ceasefire. We did what the rules allowed and what the war seemed to need. I believed it then.

I still mostly believe it. Mostly is the word that keeps me up.
"""

[[epilogue]]
when = ["hard_0", "no_hard_4"]
kind = "diary"
title = "AFTERWORD"
from = "{cag}"
date = "1997"
text = """
Ten years. People ask me what it was like and I tell them about the airplanes, because that is what they want to hear.

I don't tell them about the BEAR at 1535Z, thirty seconds after the FLASH, with a kid from Ohio sitting a hundred feet off its wing. It was the right call. The rules said so and the war said so.

I just wish I had found out whether they got out.
"""

[[epilogue]]
when = ["hard_4", "no_hard_0"]
kind = "diary"
title = "AFTERWORD"
from = "{cag}"
date = "1997"
text = """
Ten years. People ask me what it was like and I tell them about the airplanes, because that is what they want to hear.

I don't tell them about the BACKFIRE twelve minutes after the ceasefire. We couldn't be sure what it was carrying, and the order was given, and it was legal. That is what I tell myself.

It was carrying nothing. I have known that for ten years.
"""

[[epilogue]]
when = "vital_lost"
kind = "letter"
title = "THE LAST LETTER"
from = "{sailor}"
to = "{wife}"
date = "24 October 1987"
text = """
Carmen —

I'm alive. I'm writing on borrowed paper with a borrowed pen, because everything I owned went down with the Vinson, boots included.

I was in the water about forty minutes before a boat from one of the escorts pulled me out by my collar. I don't remember being cold, which the corpsman says is the bad kind of cold. I'm fine now. Some of the guys from my division aren't, and I'm not going to write about that.

It's over now. The ceasefire held. They say we'll be home in two weeks. I don't want a party. I just want to sit on the porch with you and Mikey and not look at the sky.

Danny
"""

[[epilogue]]
when = "no_vital_lost"
kind = "letter"
title = "THE LAST LETTER"
from = "{sailor}"
to = "{wife}"
date = "24 October 1987"
text = """
Carmen —

It's over. It's really over.

I went up on the flight deck this morning for the first time in four days. The sea was grey and flat and there was nothing in the sky but birds. The last Tomcat of the night came in over the stern, and when it caught the wire everybody up there cheered like it was the World Series.

We're coming home. Tell Mikey the radar kept the bad guys away. Tell him it was harder than I thought.

Danny
"""

