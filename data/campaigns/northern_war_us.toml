id = "northern_war_us"
title = "The War in the North Pacific"
faction = "US"
order = 1
summary = "Four days in October 1987, from the last hours of peace to the ceasefire, with the Carl Vinson battle group and the Eagles of Alaska. Every aircraft and ship you lose stays lost; every pilot who survives flies again, and the aces of the first night lead the last. Five battles. One war. What you do with the enemy's crews when they are helpless is up to you."
repair = 0.15
lost_text = "USS Carl Vinson is lost. The battle group's war ends with her; the Eagles of Alaska fight on."
vital = ["cvn70"]

