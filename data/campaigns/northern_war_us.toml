title = "CAG'S NOTEBOOK"
from = "{cag}"
date = "{date}"
text = """
The Granits came in at 0012Z. I watched them on the screen in CATCC and I have never felt so useless in my life.

We lost {lost} airplanes tonight. Ships: {ships_lost}. The admiral asked me how many Tomcats I can put up tomorrow and I gave him a number I am not sure of.

We are not beaten. We are not winning either.
"""

