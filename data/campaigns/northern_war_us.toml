[[mission.page]]
at = "before"
kind = "letter"
title = "A LETTER HOME"
from = "{sailor}, USS Carl Vinson"
to = "{wife}"
date = "23 October 1987"
text = """
Carmen —

They just put it on the 1MC. It ends at 0400 Zulu. That's eight at night your time, Thursday.

Nobody cheered. The chief said the Russians are going to throw everything they have left at us before then, and the chief is never wrong about the bad stuff.

So one more night. Then I'm coming home, and I'm going to sleep for a week, and then I'm going to take Mikey to the zoo and not look at the sky once.

Danny
"""

# ====================================================================== 5 — the last night

[[mission.page]]
at = "after"
when = "mercy"
kind = "report"
title = "RESCUE REPORT"
from = "HS-6, USS Carl Vinson"
date = "{date}"
text = """
0441Z. Helicopter INDIAN 612 recovered four survivors of a Tu-22M3 BACKFIRE that ditched 24 km west of the battle group after the ceasefire. Sea state 3, water temperature 4 degrees. All four hypothermic; the navigator has a broken arm.

The aircraft commander, a Major, asked through the interpreter whether the war was over. He was told it was. He did not say anything else for some time.

The four were transferred to the ship's sick bay and are being treated. The BACKFIRE was carrying no missiles.
"""

[[mission.page]]
at = "after"
when = "hard"
kind = "diary"
title = "CAG'S NOTEBOOK"
from = "{cag}"
date = "{date}"
text = """
0412Z. The order was given and the BACKFIRE went into the sea twenty-five kilometres from the ship. It was carrying no missiles.

I don't know what it was doing. Maybe it was lost. Maybe it was coming for us with nothing left but itself. Nobody will ever know, because nobody went to look.

The war was over by then. Twelve minutes over.
"""

