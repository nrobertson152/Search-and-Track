HARD NIGHT IN THE BERING SEA

The 568th came in on two axes last night and some of its missiles got through. Damage control parties are still working. Ships hit: {ships_lost}.

The air wing claims {kills} Soviet aircraft for {lost} of its own. {best} brought back {best_kills}.

"They'll be back," said the admiral's chief of staff. "So will we."
"""

