[[mission.page]]
at = "before"
kind = "report"
title = "INTELLIGENCE SUMMARY — THE SECOND NIGHT"
from = "{intel}"
date = "20 October 1987, 2200Z"
text = """
The 568th is coming back with what it has left, and a fresh BACKFIRE squadron from Mongokhto has been tracked moving north. It can come down through the Bering Strait, behind the barrier patrols.

More dangerous: the FRUNZE group has turned east. Twenty P-700 Granits, Mach 2.5, 550 km. If she gets a fix on us she will fire all of them. She can be struck first, or kept blind.

The air wing's best is now {ace}, {ace_kills} kills. The ready rooms have started a board.
"""

