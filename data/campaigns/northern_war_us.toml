from = "Printed aboard USS Carl Vinson"
date = "{date}"
text = """
BACKFIRES TURNED BACK IN BERING SEA

Navy fighters from the Carl Vinson met the Soviet Union's most dangerous bomber regiment four hundred kilometres from the ships last night and broke it up before most of its missiles could be fired. Air wing officers put the enemy's losses at {kills} aircraft.

{best} was credited with {best_kills} of them. "We were told to kill the archers before they shot," said one Tomcat crewman. "That's what we did."

The battle group's own losses: {lost} aircraft. Ships damaged or lost: {ships_lost}.
"""

