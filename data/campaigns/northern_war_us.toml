[[mission.page]]
at = "before"
kind = "letter"
title = "A LETTER HOME"
from = "{sailor}, USS Carl Vinson"
to = "{wife}"
date = "20 October 1987"
text = """
Carmen —

I'm okay. I want you to read that first in case you hear things.

Last night was the worst night of my life and I spent all of it in a chair in CIC watching dots on a screen. The dots were missiles. Some of the dots were our guys. I can't tell you more than that and I wouldn't want to.

Everybody's walking around today like they're surprised to be alive. The cooks made steak. Nobody ate much.

They say the Russians will come again tonight. I'm on watch at 2000. I'll write when I'm off.

Danny
"""

