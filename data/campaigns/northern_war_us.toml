text = """
FLASH. SECRET.

1. USS CARL VINSON (CVN 70) STRUCK BY ANTI-SHIP MISSILES. FIRES OUT OF CONTROL ON THE HANGAR DECK. SHIP DEAD IN THE WATER. ABANDON SHIP ORDERED.
2. SCREEN RECOVERING SURVIVORS. AIRBORNE AIRCRAFT OF CVW-15 DIVERTED TO GALENA AND KING SALMON.
3. OWN AIRCRAFT LOST: {lost}. ENEMY AIRCRAFT DESTROYED: {kills}. SHIPS LOST: {ships_lost}.
4. CTF 77.4 AND STAFF TRANSFERRING BY HELICOPTER TO THE SCREEN.
"""

[[lost]]
when = "not_over"
kind = "diary"
title = "CAG'S NOTEBOOK"
from = "{cag}"
date = "{date}"
text = """
I was on the flight deck when the order came. The last Tomcat on the catapult went anyway, with no deck to come back to. He made Galena with four hundred pounds of fuel, and the tower thought he was a Russian.

I put the ready-room logbooks in a mail sack and carried it down the net myself. I don't know why. It seemed important that somebody should know who flew.

Tonight: {kills} of theirs down, {lost} of ours, and the ship. Tomorrow what is left of the air wing goes ashore, and the Air Force will have to teach us to fight from a runway that doesn't move.
"""

[[lost]]
when = "over"
kind = "diary"
title = "CAG'S NOTEBOOK"
from = "{cag}"
date = "{date}"
text = """
I was on the flight deck when the order came. Three nights she took everything they had, and on the last night, with the ceasefire a few hours off, one of them got through.

I put the ready-room logbooks in a mail sack and carried it down the net myself. I don't know why. It seemed important that somebody should know who flew.

Tonight: {kills} of theirs down, {lost} of ours, and the ship. The war is over. Nobody cheered.
"""
