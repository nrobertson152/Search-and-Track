[[mission.page]]
at = "before"
when = "vital_lost"
kind = "letter"
title = "A NOTE ON THE DESK"
from = "{rocc}, Director, ROCC Elmendorf"
date = "21 October 1987"
text = """
Commander —

Welcome to Elmendorf. I'm sorry about your ship. I won't pretend tonight makes up for her, but your people at Galena are flying again and they asked for a voice on the scope that they know.

The BEARs are slow. That's the trouble: they don't need to come close. Each BEAR H carries six AS-15s, and once those are off the rails they go down to the tundra and my ground radars won't see them until they're over the fence. Kill the carriers. If you can't, the Sentries and the Eagles' look-down radars are all we've got.

My people are good and they are very tired. So am I. The coffee is in the back.

M. Hale
"""

