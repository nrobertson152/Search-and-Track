[[mission.page]]
at = "before"
kind = "report"
title = "INTELLIGENCE SUMMARY — THE FIRST NIGHT"
from = "{intel}, battle group intelligence"
date = "19 October 1987, 2100Z"
text = """
The 568th Naval Missile Regiment is airborne from Alekseyevka: two squadrons of BACKFIRE, twelve aircraft, two Kh-22 each. That's twenty-four missiles at Mach 3, and every one of them will lock the biggest return it sees. That is the carrier.

They need our position first. Expect BEAR Ds to come looking and BADGER Js to blind us. The FRUNZE group is 400 km northwest covering their approach, and her S-300F will kill anything we send at her without saturation.

Admiral Kessler's intent: kill the archers before they shoot. Meet the BACKFIREs as far out as the barrier patrols can reach. Everything else is secondary.

So far the air wing's best is {ace} with {ace_kills}. Expect that to change tonight.
"""

