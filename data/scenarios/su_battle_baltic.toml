briefing = """
COMMAND POST, 6th SEPARATE AIR DEFENSE ARMY — LENINGRAD. 21 OCTOBER 1987, 2320 MOSCOW TIME. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. Two nights of war on the Kola. Tonight NATO opens the north-west: the United States Air Force in England and Germany has been seen preparing a strike across the Baltic. Its targets will be the air defence of the Leningrad direction — the fighter airfields at Tapa and Gromovo, the radar companies on the coast, the S-200 at Kingisepp and the new S-300 battalion that covers the city. If they break the shield, the bombers will follow.

YOUR FORCES. The 656th Fighter Regiment (MiG-23P) at Tapa; Su-27s of the 177th at Gromovo, the newest aircraft we have; MiG-25PDs at Andreapol. Radar companies from Kohtla-Järve to Pskov. S-125 at Tallinn and Narva, S-200 at Kingisepp, S-300PT at Leningrad. Patrol zones WEST and SOUTH are manned.

COMMAND. You command the air defense of the direction. The duty staff identifies, commits the regiments by your standing orders and gives the battalions their targets. You set the posture, single out priority targets (right-click a track), answer the decisions and take over wherever you see better.

THE ENEMY. F-111F: terrain-following radar, 60 metres at night, 900 km/h, glide bombs. Our companies see it late. F-4G: listens for every missile radar and fires HARMs into it. EF-111A: noise jamming along the whole axis. F-15C: the best fighter they have, sent ahead to clear the way.
"""

[[intel]]
title = "F-111F"
text = "Swing-wing strike aircraft, terrain-following radar, 60-150 m above the ground at 900 km/h. Releases GBU-15 glide bombs from about 20 km and steers them onto the target. Radar companies see it at 30-40 km; the Su-27's look-down radar sees it at 60."

[[intel]]
title = "Wild Weasels"
text = "F-4G with the APR-38: it hears a missile radar long before the radar sees it, and fires AGM-88 HARMs into it. A battalion that switches off when a HARM is reported usually survives — and does not shoot either. Kill the Weasels and the battalions can fight."

[[intel]]
title = "EF-111A"
text = "The ALQ-99E jamming system in an F-111 airframe. It stands off over the Baltic and blinds the radar companies along its bearing. A hard, fast target — and a legitimate one."

[[intel]]
title = "Su-27"
text = "Ten missiles, look-down radar, fuel for a long fight. The regiment at Gromovo has had it for a year. It is the one interceptor we have that can meet an F-15 as an equal."

