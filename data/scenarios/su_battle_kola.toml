reliability = 6.0

briefing = """
COMMAND POST, NORTHERN AIR DEFENSE — KOLA PENINSULA. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. The war is six hours old. An American carrier group is in the Norwegian Sea and has turned north-east. Its task is the Northern Fleet: the bases on the Kola Inlet, the airfields that cover them, and the surface action group led by the nuclear cruiser KIROV, now at sea in the Barents to cover the submarine bastion. Expect reconnaissance first, cruise missiles from the sea, then the carrier's strike, and long-range bombers after it.

YOUR FORCES. MiG-31 regiment at Monchegorsk, MiG-25PD at Kilp-Yavr, MiG-23P at Afrikanda. An A-50 radar aircraft over the interior. Radar companies on the coast and at the guidance points, S-300PT at Severomorsk, S-200 at Olenya, S-125 and S-75 battalions around the bases. At sea: KIROV, ADMIRAL MAKAROV, OTLICHNY and ZHARKY under fleet command, their missile systems fighting on our picture.

COMMAND. You command the air defense of the sector. The duty staff identifies, commits the interceptors by your standing orders, keeps the patrol zones manned and gives the battalions their targets. You set the posture, single out priority targets (right-click a track), answer the decisions and take over wherever you see better.

LOW FLYERS. Cruise missiles and strike aircraft come in under the radar horizon, over the hills of Finnmark. The coastal radars see them late; the A-50 and the MiG-31's look-down radar see them early. Every radar that is switched on can also be heard — and the Americans carry missiles that home on radars.
"""

[[intel]]
title = "Tomahawk"
text = "BGM-109C land-attack cruise missile: subsonic, 30-60 m over the terrain, small radar cross-section. Fired in streams from ships and submarines in the Norwegian Sea. Targets: airfields, radar companies, missile battalions. MiG-31s can hunt them; the S-300 and S-125 can shoot them down if their radars see them in time."

[[intel]]
title = "HARM"
text = "AGM-88 anti-radiation missile on F/A-18 Hornets flying ahead of the strike. It homes on any radar that radiates. Battalion crews are trained to switch off when one is reported inbound — the missile then usually misses, but the battalion does not shoot either. Kill the Hornets first."

[[intel]]
title = "Strike aircraft"
text = "A-6E Intruders: Harpoon anti-ship missiles against the fleet from about 100 km; Walleye guided bombs against airfields after a low-level run. EA-6B jammers blind our radars along their axis. F-14 Tomcats sweep ahead and escort."

[[intel]]
title = "B-52"
text = "B-52G Stratofortresses from the United States, eight Harpoons each, against the KIROV group. They need to know where the fleet is: every minute it stays hidden makes their aim worse."

