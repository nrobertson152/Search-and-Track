id = "su_battle_kola"
title = "The Northern Bastion"
subtitle = "Kola Peninsula, October 1987 — hypothetical"
summary = "War. The American Navy comes for the Northern Fleet's bases: cruise missiles low over Finnmark, a carrier strike with HARM shooters and jammers, then B-52s with Harpoons for the KIROV group in the Barents Sea. Keep the radars alive, the runways open and the flagship afloat."
faction = "USSR"
