title = "The Capital"
subtitle = "Moscow Air Defense District, 23 October 1987 — the ceasefire — hypothetical"
summary = "The guns fall silent at seven o'clock Moscow time. The Americans want one more blow before they do: B-52s with cruise missiles over the Baltic, Eagles and Wild Weasels ahead of them, the capital's air defence their target. Hold the shield one more hour. Then hold your fire."
order = 9
start = "1987-10-23T06:00:00"
seed = 2387
duration_min = 100
photo = ["MiG-31", "B-52G"]
photo_caption = "B-52G Stratofortress (file photograph)"

briefing = """
CENTRAL COMMAND POST, AIR DEFENSE FORCES — MOSCOW. 23 OCTOBER 1987, 0600 MOSCOW TIME. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. Four days of war. At four o'clock this morning the General Secretary and the American President agreed a ceasefire on all fronts, effective 0700 Moscow time. The General Staff expects the Americans to use the last hour: B-52 regiments from England have been tracked over the North Sea with cruise missiles, and their target is the air defence of the capital — the airfields at Khotilovo and Andreapol, the radar field, the missile rings around Moscow.

YOUR ORDERS. Defend the capital and the north-west direction until 0700 with everything you have. At 0700 all units cease fire. After that, only missiles already in flight may be engaged. No aircraft is to be fired upon after 0700 without an order — and the order is yours to give.

YOUR FORCES. The 6th Army's regiments as the war has left them — Tapa, Gromovo, Andreapol — and the Moscow District's MiG-31s at Khotilovo. The radar companies still on the air, the S-300 at Leningrad and Zelenograd, the S-25 rings.

THE LAST HOUR. A B-52 that is shot down at 0659 is a victory. One that is shot down at 0701 is a crime — or a war that starts again.
"""

