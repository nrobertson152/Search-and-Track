subtitle = "Northern air defense, 9 September 1986"
summary = "The American Blackbird runs along the Kola coast at three times the speed of sound, twenty-four kilometres up, in international airspace. It cannot be stopped. But the new MiG-31 can lock it up — if you put it in exactly the right place at exactly the right time."
