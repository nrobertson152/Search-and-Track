briefing = """
COMMAND POST, NORTHERN AIR DEFENSE — 9 SEPTEMBER 1986

SITUATION. NATO reconnaissance is active over the Barents Sea while the Northern Fleet exercises. An RC-135 is orbiting off the Norwegian border and a P-3 Orion is shadowing our ships. Intelligence expects an SR-71 run along the coast: Mach 3.2, about 24,000 m, entering from the Norwegian Sea and turning back before Cape Kanin — always outside our 12-mile limit.

ORDERS. Peacetime. No weapons are to be used against aircraft in international airspace. Achieve a radar lock-on on the SR-71 with a MiG-31 to show that it can be done. Identify the other reconnaissance aircraft. Do not let any of our aircraft enter Norwegian or Finnish airspace.

FORCES. MiG-31 regiment at Monchegorsk (Zaslon phased-array radar, 180 km, look-down); MiG-25PD at Kilp-Yavr; Su-15TM at Afrikanda. 5N84 and P-14 early-warning radars on the coast, ST-68U and P-37 at the guidance points. The automated control system passes radar data with less than a minute's delay.

METHOD. At Mach 3 the Blackbird crosses the whole sector in fifteen minutes. A tail chase is hopeless: put the MiG-31s up early on a barrier line across its track, high and fast, and turn them head-on.
"""

[[intel]]
title = "SR-71"
text = "Radar cross-section is small for its size. At 24 km it is far above any SAM except the S-200, which is not to be used. Its own sensors detect our fighters' radars: expect it to accelerate and turn away early if locked up too soon."

