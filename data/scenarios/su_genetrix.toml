subtitle = "4th Separate Air Defense Army, 4 February 1956"
summary = "They come out of the west on the jet stream: hundreds of American balloons with camera gondolas, too high for any fighter by day. But at night the gas cools and they sink. You have until sunrise."
faction = "USSR"
