briefing = """
COMMAND POST, 4th SEPARATE AIR DEFENSE ARMY — NIGHT OF 3-4 FEBRUARY 1956

SITUATION. Since 10 January the Americans have been launching automatic reconnaissance balloons from Western Europe and Turkey. They drift east on the high-altitude winds at 150-200 km/h, carrying camera gondolas and radar reflectors. By day they float at 20-25 km, out of reach of every fighter we have. After sunset the gas cools and they sink to 10-12 km before dropping ballast. Moscow has declared every balloon a violator of the state border.

YOUR TASK. Destroy as many balloons as possible before dawn. Local sunrise is about 08:30 (06:30 Moscow time); after that they climb out of reach within the hour.

FORCES. MiG-17PF night fighters at Koltsovo, MiG-15bis at Bolshoye Savino, Yak-25M all-weather interceptors at Shagol. Guidance points at Koltsovo, Savino and Shagol; radar companies around the region report by telephone.

METHOD. The balloons have no engines and cannot manoeuvre: guide the fighter to the balloon's altitude, behind it, and let the pilot use his cannon. Do not waste fuel chasing balloons that are already climbing.
"""

[[intel]]
title = "Balloon behaviour"
text = "Float altitude follows the gas temperature: high in daylight, lowest a few hours before dawn. Radar paints the gondola and its reflector at 100-150 km. Speed over the ground equals the wind: expect 150-180 km/h toward the east."

[[intel]]
title = "Civil traffic"
text = "Aeroflot Il-14 night mail flights Sverdlovsk–Chelyabinsk–Kurgan and Sverdlovsk–Perm. They do not carry IFF."

