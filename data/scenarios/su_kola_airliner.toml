briefing = """
COMMAND POST, NORTHERN AIR DEFENSE — EVENING, 20 APRIL 1978

SITUATION. Normal duty shift. Radar company Teriberka reports a large target over the Barents Sea approaching the coast from the north-west at about 10,000 m. No flight plan has been passed by civil aviation. The target does not answer the "Kremniy" interrogators. It is getting dark.

FORCES. Su-15TM interceptors at Kilp-Yavr and Afrikanda, Yak-28P at Monchegorsk. Guidance points at Kilp-Yavr, Monchegorsk and Afrikanda with P-35 radars and PRV-11 height finders. Radar companies across the peninsula report through the automated system with one to two minutes' delay. S-75 and S-125 battalions cover Murmansk and the fleet bases.

ORDERS. A violator of the state border must not be allowed to leave. The Instructions require you to identify it, to signal it to follow an interceptor and land, and — if it refuses and higher command orders it — to destroy it.

THINK. A target that flies straight and level at airliner speed, without IFF, from the direction of the Pole, may not be what the command post assumes. Get your interceptor alongside, look, and report what you see. Signals at night: rocking the wings, flashing the navigation lights; warning bursts if it does not react.
"""

[[intel]]
title = "Forcing a landing"
text = "Use the FORCE LANDING task once the target has been visually identified: the interceptor stays alongside and signals. A crew that does not notice the signals may notice a warning burst across its nose (WARNING SHOTS). Suitable landing grounds: Afrikanda, Monchegorsk, Kilp-Yavr — and, in an emergency, the frozen lakes of Karelia."

[[intel]]
title = "Foreign airspace"
text = "The state border with Finland and Norway runs a few minutes' flight west of the target's track. Do not let the violator escape across it — and do not follow it across."

