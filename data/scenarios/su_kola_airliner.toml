title = "Lost Over Karelia"
subtitle = "Northern air defense, evening of 20 April 1978"
summary = "Inspired by the events of April 1978. A large aircraft has crossed the coast of the Kola Peninsula from the Barents Sea, heading south without IFF and without answering. Higher command wants it stopped. What it is, and how it is stopped, is up to you."
faction = "USSR"
