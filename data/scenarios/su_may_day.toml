briefing = """
COMMAND POST, 4th SEPARATE AIR DEFENSE ARMY — 1 MAY 1960, 05:40 MOSCOW TIME

SITUATION. At dawn the radars of the Turkestan district detected a single high-altitude intruder crossing the southern border. It has been tracked intermittently northward across Kazakhstan. All Air Defense Forces are at FULL combat readiness. Civil flights are being grounded. Many officers are away for the holiday.

THE INTRUDER is flying at 20,000 m or above — higher than our fighters can climb. Your weapons:
  • S-75 battalions around Sverdlovsk (north, east, south, west). The Kyshtym battalion near Chelyabinsk-40 is still deploying: it needs about 20 minutes to be ready, and only if you order it now.
  • MiG-19PM (764th IAP, Bolshoye Savino), MiG-17PF (Shagol) and one new Su-9 at Koltsovo on a ferry flight — unarmed.

YOUR PICTURE. Radar companies report to this command post by telephone. Their reports reach the plotting board 2½–4½ minutes late. The guidance points at Koltsovo, Savino and Shagol see their own scopes in real time: use their PPIs to see where the target really is.

CAUTION. Because of the holiday, the 764th IAP has not yet changed its IFF transponders to the May code.

TASK. Destroy the intruder before it leaves the Army's zone to the north. Report it to Moscow. Do not shoot down our own aircraft.
"""

[[intel]]
title = "Intruder"
text = "Single aircraft, very high altitude (20-22 km), subsonic (~700-750 km/h), steady course. No IFF reply. Probably a Lockheed U-2. Previous overflights went unpunished because no weapon could reach that height."

[[intel]]
title = "IFF codes"
text = "The May code took effect at 00:00. 764th IAP (MiG-19PM) aircraft still answer on the April code: SAM battalions will see them as FOREIGN."

[[intel]]
title = "Weather"
text = "Clear over the Urals, visibility over 40 km. A meteorological sounding balloon is released from Sverdlovsk at 06:00 as usual; it will rise to about 25 km."

