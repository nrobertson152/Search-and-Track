# ---------------------------------------------------------------- events
[[trigger]]
id = "open"
cond = { type = "time", t = 5.0 }
actions = [
  { do = "message", channel = "tty", sender = "4th ARMY CP", ack = true, kind = "order", text = "FULL COMBAT READINESS. INTRUDER CROSSED THE STATE BORDER FROM AFGHANISTAN AT 05:36. ALTITUDE OVER 20,000 M, COURSE NORTH. EXPECTED IN OUR ZONE FROM THE SOUTH (KUSTANAI). ALL CIVIL FLIGHTS TO LAND." },
]

[[trigger]]
id = "moscow"
cond = { type = "time", t = 60.0 }
actions = [
  { do = "message", channel = "voice", sender = "PVO CP MOSCOW", ack = true, kind = "order", priority = 2, text = "Moscow here. The intruder is to be destroyed at any cost. Report on it immediately and every five minutes." },
]

[[trigger]]
id = "iffwarn"
cond = { type = "time", t = 120.0 }
actions = [
  { do = "message", channel = "voice", sender = "764th IAP", ack = true, kind = "order", text = "Regiment reports: transponders not yet re-coded for May. Our aircraft will answer on the April code." },
]

[[trigger]]
id = "designate"
cond = { type = "tracked", ac = "u2" }
actions = [
  { do = "authorize", ac = "u2" },
  { do = "message", channel = "voice", sender = "PVO CP MOSCOW", ack = true, kind = "order", priority = 2, text = "The high-altitude target from the south is the violator. Fire is permitted on it. Destroy it." },
]

[[trigger]]
id = "fault"
cond = { type = "near", ac = "u2", lat = 56.80, lon = 61.20, km = 70.0 }
actions = [{ do = "sam_fault", site = "zrdn_east", seconds = 420.0 }]

[[trigger]]
id = "pressure"
cond = { type = "in_zone", ac = "u2", zone = "sverdlovsk_da" }
actions = [{ do = "message", channel = "voice", sender = "PVO CP MOSCOW", ack = true, kind = "order", priority = 2, text = "Moscow: the target is over Sverdlovsk. Why is it not destroyed? Report!" }]

[[trigger]]
id = "killed"
cond = { type = "destroyed", ac = "u2" }
actions = [
  { do = "message", channel = "voice", sender = "4th ARMY CP", delay = 900.0, text = "Ground parties report aircraft wreckage near Kosulino and a parachutist detained. The intruder is down." },
  { do = "set_var", name = "u2_down", value = 1 },
]

[[trigger]]
id = "escaped"
cond = { type = "in_zone", ac = "u2", zone = "exit_north" }
actions = [
  { do = "message", channel = "voice", sender = "PVO CP MOSCOW", priority = 2, text = "The intruder has left the 4th Army zone. Explain yourself." },
  { do = "end", reason = "Intruder left the zone", result = "failed" },
]

