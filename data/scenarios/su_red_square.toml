subtitle = "6th Air Defense Army and Moscow District, 28 May 1987"
summary = "Inspired by the flight of 28 May 1987. Border Guards' Day. A small, slow, low aircraft without IFF has crossed the Estonian coast from the Gulf of Finland. The sky is full of training flights and helicopters, and since 1983 nobody wants to be the officer who shoots down a civilian. It is 700 kilometres to the Kremlin."
