briefing = """
COMMAND POST, 6th SEPARATE AIR DEFENSE ARMY — 28 MAY 1987

SITUATION. Normal duty. It is Border Guards' Day. Training flights are planned over the Pskov, Novgorod and Kalinin regions: Yak trainers, helicopters, crop-dusters. IFF codes changed this morning and not every unit has the new period loaded. Air traffic control reports a Finnish-registered light aircraft that disappeared from their screens over the Gulf of Finland — possibly crashed.

RULES. Since 1984 the order is explicit: civil light and sport aircraft are NOT to be fired upon. Violators are to be identified, escorted and forced to land.

YOUR FORCES. Radar companies along the coast and across the Pskov–Kalinin corridor; MiG-23 at Tapa, MiG-25PD/MiG-23 at Andreapol and Khotilovo; a helicopter detachment (Mi-8) at Torzhok; S-125 and S-200 in the Baltic, S-25 and S-300 around Moscow.

THINK. A jet fighter cannot fly slowly enough to stay alongside a light aircraft. Something slower can.
"""

[[intel]]
title = "Light aircraft"
text = "Radar cross-section about 1 m², speed 200 km/h, altitude 300-700 m: below most guidance radars' horizon beyond 40-60 km, easily lost among the trainers. Keep the track; hand it over between radar companies by its number."

[[intel]]
title = "Helicopters"
text = "The Mi-8 detachment at Torzhok can be scrambled like interceptors. It is slow, unarmed, and can fly formation with a light aircraft long enough for its signals to be seen."

