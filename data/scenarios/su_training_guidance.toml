id = "su_training_guidance"
title = "Training: Guidance Point Drill"
subtitle = "Koltsovo guidance point — instructor-led"
summary = "Learn the PVO way: a delayed plotting board for decisions, a real-time guidance-point scope for control."
faction = "USSR"
kind = "training"
order = 1
theater = "middle_urals"
start = "1960-04-12T10:00:00"
tz = "MSK"
duration_min = 45
seed = 412
reliability = 50.0

briefing = """
COMMAND POST, 4th SEPARATE AIR DEFENSE ARMY — TRAINING EXERCISE

An Il-14 of the Army's liaison squadron will play the intruder, approaching Sverdlovsk from the west at about 4,000 m with its IFF switched off.

What you will learn:
  1. The PLOTTING BOARD shows radar-company reports. Each mark is minutes old: the time label tells you how old. The dashed line is our extrapolation.
  2. The guidance point at Koltsovo has its own P-30 radar. Its scope (RADAR, F2) shows the target in real time.
  3. Scramble a MiG-17PF pair from Koltsovo, keep them under Koltsovo guidance, and identify the target visually.

The instructor will prompt you on the teletype.
"""

[automation]
surveil = true
ident = false
height = false
tech = true

[weather]
k_factor = 1.333
wind_from = 270.0
wind_kmh = 50.0
ceiling_m = 5000.0
visibility_km = 30.0
night = false

[hq]
name = "4th ARMY CP"
readiness = "CONSTANT"
weapons_status = "HOLD"
[hq.policy]
response_s = [40.0, 90.0]
declare_hostile = "deny"
engage = "deny"
iff_period = "APR"
track_start = 3101

[[link]]
id = "T_gp"
name = "Guidance points"
[[link]]
id = "T_tagil"
name = "Nizhny Tagil telephone"
[[link]]
id = "A_koltsovo"
name = "Koltsovo line"
delay_s = 15.0

[[radar]]
site = "koltsovo_gp"
type = "P-30"
gci = true
link = "T_gp"
[[radar]]
site = "rlr_tagil"
type = "P-10"
link = "T_tagil"
[[radar]]
site = "rlr_zlatoust"
type = "P-20"
link = "T_gp"

[[airbase]]
site = "koltsovo"
link = "A_koltsovo"

[[squadron]]
id = "kol_iap"
name = "Koltsovo IAP"
base = "koltsovo"
type = "MiG-17PF"
callsign = "5"
ready = { "3" = 2, "7" = 2 }
pilots = 4
iff_codes = { period = "APR" }

[[flight]]
id = "target"
type = "Il-14"
callsign = "EXERCISE TARGET"
side = "blue"
spawn_t = 30.0
truth_label = "Il-14 (exercise target)"
markings = "red star, liaison squadron"
start = { lat = 57.1, lon = 56.6, alt_m = 4000.0, kmh = 330.0 }
route = [
  { lat = 56.9, lon = 59.2, alt_m = 4000.0, kmh = 330.0 },
  { lat = 56.8, lon = 61.8, alt_m = 4000.0, kmh = 330.0 },
  { lat = 56.7, lon = 64.5, alt_m = 4000.0, kmh = 330.0, action = "remove" },
]
transponder = { system = "kremniy", on = false, codes = { period = "APR" } }

[[trigger]]
id = "t0"
cond = { type = "time", t = 5.0 }
actions = [{ do = "message", channel = "tty", sender = "INSTRUCTOR", ack = true, text = "Watch the plotting board to the west. Radar companies telephone their targets in every minute; each mark arrives minutes late and is labelled with its observation time." }]

[[trigger]]
id = "t1"
cond = { type = "tracked", ac = "target" }
actions = [{ do = "message", channel = "tty", sender = "INSTRUCTOR", ack = true, text = "A target number has been allotted. It has no IFF reply: set it UNIDENTIFIED. Now press F2 for the RADAR scope and select Koltsovo guidance point — compare its live picture with the board. The difference is how far the target has flown since it was reported." }]

[[trigger]]
id = "t2"
cond = { type = "identity", ac = "target", is = ["unknown"] }
actions = [{ do = "message", channel = "tty", sender = "INSTRUCTOR", ack = true, text = "Scramble a pair from Koltsovo (F3 WEAPONS, task ID PASS). The guidance officer at Koltsovo will steer them with his own radar once both aircraft are on his scope." }]

[[trigger]]
id = "t3"
cond = { type = "vid", ac = "target" }
actions = [{ do = "message", channel = "tty", sender = "INSTRUCTOR", ack = true, text = "Visual identification received. Set the target OWN (it is our exercise aircraft) and return the pair to base." }]

[[trigger]]
id = "t4"
cond = { type = "all", of = [{ type = "vid", ac = "target" }, { type = "flights_home" }] }
actions = [
  { do = "message", channel = "tty", sender = "INSTRUCTOR", text = "Exercise complete. In the field the board is for decisions; the guidance point scope is for control." },
  { do = "end", reason = "Exercise complete", result = "complete" },
]

[[objective]]
id = "ident"
text = "Set the exercise target UNIDENTIFIED until it is identified"
kind = "identify"
params = { ac = "target", correct = ["unknown", "friend"], wrong = ["hostile", "suspect"] }
points = 30

[[objective]]
id = "vid"
text = "Identify the target visually"
kind = "vid"
params = { ac = "target" }
points = 50

[[objective]]
id = "frat"
text = "No fratricide"
kind = "no_fratricide"
points = 20
penalty = 50
