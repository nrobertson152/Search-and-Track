briefing = """
COMMAND POST, 4th SEPARATE AIR DEFENSE ARMY — TACTICAL EXERCISE, ELECTRONIC WARFARE

A Tu-16 with an SPS noise jammer will play the enemy, coming from the north-west toward Sverdlovsk with its jammer running. It is a TRAINING target.

What you will learn:
  1. What a barrage jammer does to a scope.
  2. Frequency diversity: the jammer covers the centimetric band, not the metric one. Our radar positions mix both on purpose.
  3. Keeping the plotting board alive from the radars that can still see.
  4. Guiding a pair from the board when the guidance-point radars are blind.

The instructor's card is pinned to the plotting board.
"""

