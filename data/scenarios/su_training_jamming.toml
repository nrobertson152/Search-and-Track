# ---------------------------------------------------------------- instructor
[[lesson]]
title = "Noise on the scope"
text = "The Tu-16 is running a barrage jammer. On the board you will see nothing yet: look at the guidance point's own scope. The noise paints a bright spoke along the jammer's bearing and hides everything behind it."
action = "Press M, or the RADAR SCOPE key"
mode = "scope"
highlight = ["RADAR SCOPE"]
done = { type = "ui", event = "mode_scope" }

[[lesson]]
title = "Another band"
text = "Koltsovo's P-30 works in the centimetric band, and so does the jammer. The P-12 of the Kamensk radar company and the P-10 at Nizhny Tagil work on metre waves, far outside its reach. Look at Kamensk."
action = "Step to the Kamensk radar company with < and > (or , and .)"
mode = "scope"
highlight = ["<", ">"]
mark = "drone"
mark_label = "JAMMER"
mark_label_ru = "ПОСТАНОВЩИК ПОМЕХ"
done = { type = "ui", event = "scope_rlr_kamensk" }

[[lesson]]
title = "The board holds"
text = "The metric-band companies go on telephoning in their targets, so the board keeps the jammer: a target number will be allotted from their reports. This is why every PVO radar position mixes bands."
action = "Press M twice for the BOARD and wait for the target number"
mode = "map"
console = "TRACKS"
highlight = ["BOARD", "TABLE tracks"]
mark = "drone"
mark_label = "TRAINING TARGET"
mark_label_ru = "УЧЕБНАЯ ЦЕЛЬ"
done = { type = "tracked", ac = "drone", skin = true }

[[lesson]]
title = "Identify"
text = "It is our Tu-16, playing the enemy: on the board, a TRAINING target."
action = "TRACKS F1: select its target number, press TRAINING"
console = "TRACKS"
highlight = ["TRAINING", "TABLE tracks"]
done = { type = "identity", ac = "drone", is = ["faker"], skin = true }

[[lesson]]
title = "Scramble"
text = "Send a pair from Koltsovo for an identification pass. The guidance-point radars are centimetric and jammed, so the pair will be steered from the board, on reports minutes old."
action = "WEAPONS F2: ×2, ID PASS, then SCRAMBLE ON the target"
console = "WEAPONS"
highlight = ["×2", "ID PASS", "SCRAMBLE*"]
mark = "koltsovo"
mark_label = "KOLTSOVO IAP"
mark_label_ru = "КОЛЬЦОВО · ИАП"
done = { type = "scrambled", n = 1 }

[[lesson]]
title = "Guidance from the board"
text = "Each vector is computed from the board, extrapolated over the reporting delay. The last few kilometres are up to the pilots' own eyes and radar. Speed up time while they fly."
action = "Press 8× (or +) and watch the pair close"
highlight = ["8×", "TABLE fl"]
mark = "drone"
done = { type = "vid", ac = "drone" }

[[lesson]]
title = "Return to base"
text = "Visual identification complete: our Tu-16. Bring the pair home."
action = "WEAPONS F2: select the flight, press RTB"
console = "WEAPONS"
highlight = ["RTB", "TABLE fl"]
done = { type = "any", of = [{ type = "flight", state = "rtb" }, { type = "flights_home" }] }

[lesson_end]
title = "Exercise complete"
text = "A barrage jammer blinds one band, not all of them. Many radars on many wavelengths kept the board alive, and the board guided the pair. That is the training course complete."
reason = "Exercise complete"

