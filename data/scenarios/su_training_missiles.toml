briefing = """
COMMAND POST, 4th SEPARATE AIR DEFENSE ARMY — TACTICAL EXERCISE

A Tu-16 of Long-Range Aviation will fly a simulated attack on Sverdlovsk from the west. It is a TRAINING target: under exercise rules our battalions and fighters may engage it. Launches are simulated and the umpires score them.

What you will learn:
  1. Exercise rules: what may be engaged, and what may not.
  2. The S-75 battalions: designating a target from the command post.
  3. The command post's authority: what it takes to declare a target a VIOLATOR.
  4. Identification before engagement, always.

The instructor's card is pinned to the plotting board. Radar-company reporting is automatic; identification is yours.
"""

