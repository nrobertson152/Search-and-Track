# ---------------------------------------------------------------- instructor
[[lesson]]
title = "The training target"
text = "A Tu-16 of Long-Range Aviation is playing the enemy today, coming in from the west. On the board it is a TRAINING target: under exercise rules our battalions and fighters may engage it, and the umpires score the launches. Everything else is real."
action = "TRACKS F1: select its target number, press TRAINING"
mode = "map"
console = "TRACKS"
highlight = ["TRAINING", "TABLE tracks"]
mark = "drone"
mark_label = "TRAINING TARGET"
mark_label_ru = "УЧЕБНАЯ ЦЕЛЬ"
done = { type = "identity", ac = "drone", is = ["faker"] }

[[lesson]]
title = "The missile battalions"
text = "S-75 battalions ring Sverdlovsk. The command post designates the target; the battalion's P-12 finds it and its guidance radar locks on. A battalion accepts targets within about 190 km and fires inside 34 km. The West battalion at Degtyarsk is in the target's path."
action = "MISSILES F3: select the West battalion, then DESIGNATE the target"
console = "MISSILES"
highlight = ["TABLE sams", "DESIGNATE*"]
mark = "zrdn_west"
mark_label = "SAM BATTALION WEST"
mark_label_ru = "ЗРДН «ЗАПАД»"
done = { type = "any", of = [{ type = "site", site = "zrdn_west", attr = "assigned", op = "!=", value = "" }, { type = "site", site = "zrdn_north", attr = "assigned", op = "!=", value = "" }] }

[[lesson]]
title = "Simulated launch"
text = "The guidance radar locks on and the battalion launches when the target is inside its zone. In an exercise the launch is simulated: the umpires assess the result and the Tu-16 flies on, scored destroyed. After a miss the battalion waits for orders unless re-engagement is automatic."
action = "MISSILES F3: switch AUTO RE-ENG on, then press 8× (or +) and watch"
console = "MISSILES"
highlight = ["AUTO RE-ENG", "8×"]
mark = "drone"
mark_label = "TRAINING TARGET"
mark_label_ru = "УЧЕБНАЯ ЦЕЛЬ"
done = { type = "sim_killed", ac = "drone" }

[[lesson]]
title = "A stranger"
text = "A slow target with no IFF reply is coming up from the south-west toward Chelyabinsk. Nobody has seen it, so it is not the training target: it is UNIDENTIFIED, and exercise rules do not cover it."
action = "TRACKS F1: select the new target, press UNIDENTIFIED"
console = "TRACKS"
highlight = ["UNIDENTIFIED", "TABLE tracks"]
mark = "stray"
mark_label = "UNIDENTIFIED"
mark_label_ru = "НЕОПОЗНАННАЯ"
done = { type = "identity", ac = "stray", is = ["unknown"] }

[[lesson]]
title = "The command post"
text = "Only the command post can declare a target a VIOLATOR. Ask them, and see what they want before they will."
action = "COMMS F6: with the target selected, press HOSTILE"
console = "COMMS"
highlight = ["HOSTILE*"]
done = { type = "request", kind = "declare_hostile", answered = true }

[[lesson]]
title = "Go and look"
text = "The command post wants evidence: a visual identification, an active jammer, or a hostile act. Scramble a pair from Koltsovo for an identification pass. Fire is forbidden."
action = "WEAPONS F2: ×2, ID PASS, then SCRAMBLE ON the target"
console = "WEAPONS"
highlight = ["×2", "ID PASS", "SCRAMBLE ON*"]
mark = "koltsovo"
mark_label = "KOLTSOVO IAP"
mark_label_ru = "КОЛЬЦОВО · ИАП"
done = { type = "scrambled", n = 1 }

[[lesson]]
title = "Guidance"
text = "A slow, low target is hard to find: the pair must slow down and come in from behind. Speed up time while they fly."
action = "Press 8× (or +) and watch the pair close"
highlight = ["8×", "TABLE fl"]
mark = "stray"
done = { type = "vid", ac = "stray" }

[[lesson]]
title = "Aeroflot"
text = "The leader reports an Aeroflot Il-14, far off its airway, with its transponder dead. Set it OWN; the airport controllers at Shagol will bring it in."
action = "TRACKS F1: press OWN"
console = "TRACKS"
highlight = ["OWN"]
done = { type = "identity", ac = "stray", is = ["friend"] }

[[lesson]]
title = "Return to base"
text = "Bring the pair home."
action = "WEAPONS F2: select the flight, press RTB"
console = "WEAPONS"
highlight = ["RTB", "TABLE fl"]
done = { type = "any", of = [{ type = "flight", state = "rtb" }, { type = "flights_home" }] }

[lesson_end]
title = "Exercise complete"
text = "Exercise rules covered the training target. Everything else needed a positive identification first, and the command post wanted evidence before it would call anything a violator. Next: the Jamming Drill."
reason = "Exercise complete"

