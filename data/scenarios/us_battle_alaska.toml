briefing = """
ALASKAN NORAD REGION — ROCC ELMENDORF. 21 OCTOBER 1987, 0640Z. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. Two nights of raids on the Carl Vinson have cost the Soviet naval aviation half its BACKFIREs. Tonight they are going after what keeps the battle group alive: the Eagles at Galena and King Salmon, the radar line on the west coast, the tankers and the AWACS that fly from Elmendorf. Long-Range Aviation has BEAR H regiments at Anadyr and Ukrainka. Each BEAR H carries six AS-15 cruise missiles.

YOUR FORCES. F-15A Eagles of the 21st Tactical Fighter Wing: detachments on alert at Galena and King Salmon, the 43rd and 54th squadrons at Elmendorf. Two E-3A Sentries airborne — DARKSTAR over Norton Sound, SENTRY 2 over Bristol Bay. The Seek Igloo radars from Tin City to King Salmon. Combat air patrols NOME, BETHEL and KOTZEBUE are up.

COMMAND. You command the Region's air battle tonight. The ROCC staff identifies, commits the Eagles by your standing orders and keeps the patrols manned. You set the posture, single out priority targets (right-click a track), answer the decisions and take over wherever you see better.

THE MISSILES. Once they are off the rails, the AS-15s go down to the hills at 60 metres and 750 km/h. The coastal radars see them a few dozen kilometres out. Only the Sentries and the Eagles' look-down radars see them early. Better to kill the carrier than chase its six missiles.
"""

[[intel]]
title = "BEAR H"
text = "Tu-95MS: turboprop, 750 km/h at 10-11 km, six Kh-55 on a rotary launcher. Big radar return, slow, no escort this far from home. It has to come within about 400 km of its target to launch on the terrain maps the missiles carry: that is where the Eagles must meet it."

[[intel]]
title = "AS-15 KENT"
text = "Kh-55 cruise missile: radar cross-section about a tenth of a square metre, 750 km/h, 50-100 m above the terrain. It flies straight to its target from the launch point. An Eagle above its track sees it on the look-down radar at 40-60 km."

[[intel]]
title = "FOXHOUNDs"
text = "MiG-31s from Anadyr have the reach to sweep the Bering Strait. They are not escorting the bombers: they are hunting the Sentries. Without DARKSTAR the Eagles are blind to low flyers in the north."

[[intel]]
title = "Jamming"
text = "A BADGER J with noise jammers is expected over St. Lawrence Island against the coastal radars. It is a legitimate target, and a soft one."

