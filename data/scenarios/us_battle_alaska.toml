subtitle = "Alaskan NORAD Region, 21 October 1987 — hypothetical"
summary = "The Soviets have stopped throwing regiments at the carrier and gone for the bases that keep her alive. BEAR H carriers with AS-15 cruise missiles come at Alaska from the west — and then from over the top. Kill the carriers before they launch, hunt the missiles in the dark, keep Galena open."
