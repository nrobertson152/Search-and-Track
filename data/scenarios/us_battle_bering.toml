[[battle.phase]]
id = "ew"
name = "PHASE II — ELECTRONIC ATTACK"
earliest_min = 7.0
latest_min = 14.0
when = { type = "located" }
quiet_s = 180.0
text = "ESM reports BADGER jammers forming up to the west, and FOXHOUNDs. They are clearing the way for the regiment. Expect the picture to degrade along the threat axis."
actions = [
  { do = "launch", groups = ["ew_south", "ew_north"] },
  { do = "launch", groups = ["foxhound"], delay_s = 60.0 },
  { do = "decision", kind = "caps", title = "PUSH THE CAPS OUT?", text = "Intelligence expects the regiment within half an hour. Move the three barrier patrols 50-60 km further west: more time to kill BACKFIREs before they can fire — but closer to the FOXHOUNDs, and further from the fleet.", options = ["PUSH OUT", "KEEP THEM CLOSE"], default = "PUSH OUT", timeout_s = 60.0, effects = { "PUSH OUT" = [{ do = "cap_station", id = "west", x = -625.0, y = -440.0 }, { do = "cap_station", id = "southwest", x = -615.0, y = -585.0 }, { do = "cap_station", id = "north", x = -540.0, y = -380.0 }], "KEEP THEM CLOSE" = [] } },
]

[[battle.phase]]
id = "raid"
name = "PHASE III — THE RAID"
earliest_min = 13.0
latest_min = 21.0
when = { type = "any", of = [{ type = "located" }, { type = "quiet", s = 150.0 }] }
text = "Raid warning. Kamchatka reports the missile regiment airborne forty minutes ago: two squadrons of BACKFIRE expected on the western edge in about five minutes, BADGERs behind them. Kill the archers before they shoot."
actions = [
  { do = "launch", groups = ["backfire_a", "escort_a"], delay_s = 300.0 },
  { do = "launch", groups = ["backfire_b"], delay_s = 420.0 },
  { do = "launch", groups = ["badger_g"], delay_s = 600.0 },
  { do = "decision", kind = "deck", title = "LAUNCH THE ALERT DECK?", text = "The raid is coming. Bring every Tomcat on deck to five-minute alert now — the staff can throw them all at the bombers — or keep the 45-minute reserve for the second wave?", options = ["LAUNCH THE DECK", "HOLD THE RESERVE"], default = "LAUNCH THE DECK", timeout_s = 50.0, effects = { "LAUNCH THE DECK" = [{ do = "ready", squadron = "vf51", move = { "15" = "5", "45" = "5" } }, { do = "ready", squadron = "vf111", move = { "15" = "5", "45" = "5" } }, { do = "standing", reserve = 0 }, { do = "surge", squadrons = ["vf51", "vf111"], x = -560.0, y = -470.0, alt_m = 9000.0, max_flights = 3 }], "HOLD THE RESERVE" = [{ do = "ready", squadron = "vf51", move = { "15" = "5" } }, { do = "ready", squadron = "vf111", move = { "15" = "5" } }, { do = "surge", squadrons = ["vf51"], x = -500.0, y = -450.0, alt_m = 9000.0, max_flights = 1 }] } },
  { do = "reinforcement", id = "eagles" },
]

[[battle.phase]]
id = "strike"
name = "PHASE IV — COUNTERSTRIKE"
earliest_min = 19.0
latest_min = 30.0
when = { type = "any", of = [{ type = "released", groups = ["backfire_a", "backfire_b"] }, { type = "group", group = "backfire_a", is = ["done"] }] }
text = "The Frunze group is still covering the regiment's approach. Alpha strike ready on deck: six Intruders with Harpoons, a Prowler, four Tomcats in escort."
actions = [
  { do = "decision", kind = "strike", title = "LAUNCH THE ALPHA STRIKE?", text = "Six A-6Es with twelve Harpoons against the Frunze group, 400 km northwest. FRUNZE's S-300F will meet them; the Prowler will jam its radars. Launch now, while the regiment is busy, or hold the Intruders?", options = ["LAUNCH", "HOLD"], default = "LAUNCH", timeout_s = 60.0, effects = { "LAUNCH" = [{ do = "launch", groups = ["alpha", "prowler", "alpha_escort"] }], "HOLD" = [] } },
]

[[trigger]]
id = "emcon_q"
cond = { type = "time", t = 20.0 }
actions = [{ do = "decision", kind = "emcon", title = "EMISSION CONTROL?", text = "A BEAR D is coming to find us, and it listens before it looks: our ship radars can be heard 450 km away. Go silent — ships' radars off, the Hawkeye and DARKSTAR keep the picture — and make it come close enough for the Tomcats? Or keep radiating and see everything?", options = ["GO SILENT", "KEEP RADIATING"], default = "GO SILENT", timeout_s = 60.0, effects = { "GO SILENT" = [{ do = "standing", emcon = true }], "KEEP RADIATING" = [] } }]

