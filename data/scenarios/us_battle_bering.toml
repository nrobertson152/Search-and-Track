title = "The Outer Air Battle"
subtitle = "Bering Sea, October 1987 — hypothetical"
summary = "War. The Carl Vinson battle group is in the Bering Sea and the Soviet Pacific Fleet's missile regiment is coming for it: shadowers first, then jammers, then two squadrons of BACKFIREs with Kh-22s, Mach 3 missiles that dive from 22 km. Kill the archers before they shoot, survive the arrows, and send the Intruders against the Frunze group."
