briefing = """
TASK FORCE 77.4 — CARL VINSON BATTLE GROUP, BERING SEA. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. The war is six hours old. The battle group is steaming in the eastern Bering Sea, 400 km from the Soviet coast, to hold the Pacific Fleet's naval aviation away from Alaska. The 568th Naval Missile Regiment (Tu-22M3 BACKFIRE) has been tracked moving forward. Before a regiment can fire it needs the fleet's position: expect BEAR D shadowers first, BADGER jammers to blind the picture, then the raid. A Soviet surface action group led by the battlecruiser FRUNZE is covering their approach 400 km to the northwest.

YOUR FORCES. CVN-70 Carl Vinson with VF-51 and VF-111 (F-14A), VA-52 (A-6E with Harpoon), an E-2C Hawkeye and an EA-6B. Aegis cruiser Bunker Hill, nuclear cruiser Truxtun, destroyer Chandler, frigates Reid and Rentz (radar picket to the west). USAF F-15As at King Salmon and Galena, E-3A DARKSTAR on station over the coast, and the Alaskan radar line.

COMMAND. You are the battle group's air-defense commander. The staff runs the routine: it identifies, commits fighters by your standing orders, manns the patrols and gives the missile cruisers their targets. You set the posture, single out priority targets (right-click a track), answer the decisions, and step in wherever you see better. Everything works from the radar picture: what the radars do not see, nobody can shoot.

THE OUTER AIR BATTLE. A BACKFIRE launches from 250-300 km. Every bomber killed before it fires is two Mach-3 missiles that never come. Every missile that does come is hard to kill: Aegis, the Terriers and the close-in guns get their chance in the last minutes.

EMISSION CONTROL. The shadowers listen for our radars. A silent fleet is hard to find — and half blind.
"""

[[intel]]
title = "BACKFIRE"
text = "Tu-22M3: Mach 1.9 dash, two Kh-22 each. The regiment attacks in squadrons of six from two directions to split the defences, launching at about 270 km. Its radar comes on in the last 300 km — our ESM will hear it."

[[intel]]
title = "Kh-22 / AS-4 KITCHEN"
text = "Liquid-fuelled, Mach 3+ at 22 km, steep terminal dive, 1000 kg warhead. Its radar seeker locks the biggest return it sees: that is usually the carrier."

[[intel]]
title = "BEAR D"
text = "Tu-95RTs: finds carrier groups with its big radar or by listening to theirs, then relays targeting data. If it holds us long enough, the raid gets an accurate aim point. Kill it, or deny it."

[[intel]]
title = "Frunze group"
text = "Battlecruiser FRUNZE (S-300F, 96 missiles), Kresta II VASILY CHAPAYEV, destroyer BOYEVOY, frigate RAZITELNY. Saturate it: one Harpoon at a time will not get through."

