subtitle = "Bering Sea, the second night — hypothetical"
summary = "The regiment comes back — what is left of it — with a fresh squadron of BACKFIREs coming down through the Bering Strait. And somewhere to the northwest the FRUNZE is closing with twenty Granit missiles. Strike her before she finds you, or hide from her."
