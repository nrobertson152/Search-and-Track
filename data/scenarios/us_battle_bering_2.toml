briefing = """
TASK FORCE 77.4 — CARL VINSON BATTLE GROUP, BERING SEA. THE SECOND NIGHT. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. Last night's raid has been beaten off at a price. The 568th Regiment is coming again with the BACKFIREs it has left, and a fresh squadron from Mongokhto has been tracked moving north: it can come down through the Bering Strait, from a direction our barrier patrols do not face. The surface action group led by the battlecruiser FRUNZE is closing from the northwest. She carries twenty P-700 Granit missiles — Mach 2.5, 550 km. If she gets a fix on us, she will fire them all.

YOUR FORCES. What is left of the air wing and the group after last night. Six Intruders with Harpoons are ready for an alpha strike, with a Prowler and four Tomcats.

COMMAND. Two problems at once. The Granits can be stopped before they are fired: hit the FRUNZE first, or keep her blind — kill the BEAR Ds and keep the ships silent. The BACKFIREs must be met further out than last night, and on two axes.

NIGHT. Visual identification is out of the question; the staff identifies by the battle rules.
"""

