title = "The Last Night"
subtitle = "Bering Sea, 23 October 1987 — the ceasefire — hypothetical"
summary = "Moscow and Washington have agreed: the guns fall silent at 0400Z. The Pacific Fleet's naval aviation has one hour left to sink the Carl Vinson and it is throwing everything it has. Survive the hour. Then keep your finger off the trigger."
order = 9
start = "1987-10-23T03:00:00"
seed = 2310
