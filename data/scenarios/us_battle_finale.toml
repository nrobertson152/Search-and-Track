  { do = "say", kind = "story", after_s = 200.0, text = "Hawkeye: single contact, low and slow, from the west, 100 miles. Burning on the infrared. Guard frequency, once, in English: 'Mayday... no fuel... four men.'", level = 3 },
  { do = "decision", after_s = 230.0, kind = "mercy", title = "A BACKFIRE — AFTER THE CEASEFIRE", text = "Eleven minutes after the ceasefire a single BACKFIRE is coming straight at the battle group, low, slow, burning. The Hawkeye sees no missiles under its wings — at night, at this range, it cannot be sure. Last night a BACKFIRE that looked like this one fired at the Truxtun. The ceasefire says hold fire. The Tomcats on the barrier can have it in two minutes.", options = ["LET IT DITCH", "SHOOT IT DOWN"], default = "LET IT DITCH", timeout_s = 50.0, effects = { "LET IT DITCH" = [{ do = "spare", groups = ["stray"], text = "Hold fire. The BACKFIRE is allowed to come down. Helicopters from the Carl Vinson are standing by." }], "SHOOT IT DOWN" = [{ do = "standing", emcon = false }, { do = "engage", groups = ["stray"], text = "Weapons free on the BACKFIRE — ceasefire or not." }] } },
