photo = ["F-14A", "Tu-22M3"]
photo_caption = "F-14A on the catapult of USS Carl Vinson (file photograph)"

briefing = """
TASK FORCE 77.4 — CARL VINSON BATTLE GROUP, BERING SEA. 23 OCTOBER 1987, 0300Z. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. Four days of war. At 0100Z the National Command Authority announced that the United States and the Soviet Union have agreed to a ceasefire on all fronts, effective 0400Z. Fleet intelligence expects the Pacific Fleet to use the last hour: the BACKFIREs it has left, the BADGERs, and the FRUNZE group, which is still at sea to the northwest with her Granits.

YOUR ORDERS. Defend the battle group until 0400Z with everything you have. At 0400Z all units cease fire. After that, defend only against weapons already in the air. No aircraft is to be engaged after 0400Z without a direct order — and the order will come from you.

YOUR FORCES. What is left of the air wing and the screen after three nights. The alpha strike is still on deck if you want it.

THE LAST HOUR. Every pilot in the air wing knows the hour. So does every Soviet pilot. Some of them will want to finish what they started.
"""

