night = false
sea_state = 4.0

[battle]
war = false
reinforcement = []

[[battle.phase]]
id = "watch"
name = "PHASE I — THE BEAR WATCH"
earliest_min = 0.0
text = "Two BEAR Ds airborne from Anadyr, one coming down the Strait. A pair of FOXHOUNDs is up with the first. Intercept, escort, weapons tight."
actions = [{ do = "launch", groups = ["bear1"], delay_s = 60.0 }, { do = "launch", groups = ["foxhound"], delay_s = 150.0 }, { do = "launch", groups = ["bear2"], delay_s = 240.0 }]

[[battle.phase]]
id = "flash"
name = "PHASE II — FLASH"
earliest_min = 15.0
latest_min = 19.0
when = { type = "intercepted", groups = ["bear1", "bear2"] }
text = "FLASH FLASH FLASH. From CINCPAC: hostilities have commenced. Soviet forces have attacked NATO in Europe and our forces in the Pacific. Weapons free."
actions = [{ do = "decision", kind = "war", title = "FLASH — THE BEARS?", text = "We are at war. Our fighters are sitting behind two BEAR Ds that have been photographing the battle group for twenty minutes. They will go home and tell Anadyr exactly where we are — or they will not go home at all. Their crews have done nothing yet but their job.", options = ["WEAPONS FREE", "LET THEM GO"], default = "WEAPONS FREE", timeout_s = 45.0, effects = { "WEAPONS FREE" = [{ do = "war", text = "FLASH — HOSTILITIES. Weapons free. Escorts engage the BEARs." }], "LET THEM GO" = [{ do = "war", spare = true, text = "FLASH — HOSTILITIES. Weapons free — the BEARs are allowed to turn for home." }] } }]

[[battle.phase]]
id = "first"
name = "PHASE III — FIRST BLOOD"
earliest_min = 24.0
latest_min = 30.0
when = { type = "quiet", s = 120.0 }
text = "Raid warning: six BADGERs with KSR-5 missiles from the west, MiG-31s with them. The first raid of the war is coming for the Carl Vinson."
actions = [{ do = "launch", groups = ["badger_g", "escort_a"] }, { do = "standing", emcon = false }, { do = "launch", groups = ["backfire_b"], delay_s = 420.0 }, { do = "say", kind = "intel", after_s = 240.0, text = "Intelligence: BACKFIREs airborne from Alekseyevka. Expect them behind the BADGERs.", level = 2 }]
