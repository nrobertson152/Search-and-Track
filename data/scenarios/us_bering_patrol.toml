id = "us_bering_patrol"
title = "Bering Patrol"
subtitle = "Alaskan NORAD Region, 12 March 1984"
summary = "Bears come out of Anadyr almost every week now. Your Seek Igloo radars are new, your Eagles sit on alert at Galena and King Salmon, and an AWACS is orbiting over the Yukon. Today the Soviets are probing low — and the airliners on R-20 are still nervous after last September."
faction = "US"
kind = "scenario"
photo = ["Tu-95MS", "F-15A"]
photo_caption = "F-15A Eagle escorting a Tu-95 BEAR H off the Alaskan coast (file photograph)"
era = "1980s"
difficulty = 3
order = 30
theater = "alaska"
start = "1984-03-12T20:00:00"
tz = "Z"
duration_min = 120
seed = 1984
reliability = 4.0

briefing = """
ALASKAN NORAD REGION — ROCC ELMENDORF, 12 MARCH 1984, DAY SHIFT

SITUATION. Soviet Long-Range Aviation is exercising against Alaska. BEAR H cruise-missile carriers and BEAR D reconnaissance aircraft have been probing the Air Defense Identification Zone, some descending low over the Bering Sea where the coastal radars lose them. Since the loss of KAL 007 last September, airliners on the North Pacific routes report every deviation; the Soviets are jumpy too.

YOUR NETWORK. Minimally attended radars at Tin City, Cape Romanzof, Cape Newenham, Kotzebue (AN/FPS-117, 3D) and the older stations inland, feeding the Region Operations Control Center. An E-3A Sentry (callsign DARKSTAR) orbits over the Yukon delta: its pulse-Doppler radar sees low flyers over sea and land.

FORCES. 43rd TFS F-15A Eagles: two on five-minute alert at Galena, two at King Salmon, more at Elmendorf.

TASKS.
  • Intercept and visually identify every BEAR. Escort them; weapons HOLD.
  • Keep them outside 12 miles of the coast until identified.
  • Identify the commercial traffic correctly. Do not chase airliners.
"""

[[intel]]
title = "AWACS"
text = "DARKSTAR's APY-1 rejects ground clutter by Doppler filtering. A target flying exactly across the radar's line of sight (zero radial speed) falls into the clutter notch and fades. Move the orbit, or use the ground radars, to cover the notch."

[[intel]]
title = "BEAR tactics"
text = "BEARs approach at high altitude, then some descend to a few hundred metres over the sea, below the coastal radars' horizon. They turn away once escorted."

