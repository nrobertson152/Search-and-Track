briefing = """
MIAMI AIR DEFENSE SECTOR — SUNDAY DAY SHIFT, 5 OCTOBER 1969

SITUATION. Quiet weekend traffic. The President is at Key Biscayne; AIR FORCE ONE is on the ramp at Homestead AFB. Cuba has been flying more MiG patrols along its north coast this month. Freedom Flights from Varadero arrive at Miami twice a day under filed flight plans.

YOUR SECTOR. Long-range radars at Richmond (with height finder), Key West, MacDill and Patrick, a gap filler at Naples. Interceptors: an F-102A alert detachment and F-4s of the 31st Tactical Fighter Wing at Homestead, Navy Phantoms at Key West, F-4s at MacDill. Army Nike Hercules batteries ring Miami; Hawk batteries cover Key West.

THE PROBLEM. Long-range radars cannot see a low flyer beyond about 40 miles over the sea. The gap filler and the height finders help, but only if someone is watching.

TASKS.
  • Detect anything approaching from Cuba before it crosses the coast.
  • Identify it. Peacetime rules: weapons HOLD. A defector is a gift, not a target.
  • Nothing unidentified reaches Homestead while AIR FORCE ONE is on the ramp.
"""

