id = "us_northern_shield"
title = "Northern Shield"
subtitle = "Alaskan NORAD Region, February 1986 — hypothetical"
summary = "A what-if built from the plans of the time. The crisis has gone too far. Six BEAR H carriers are coming over the Bering Sea with cruise missiles that hug the ground below every radar in Alaska except the ones flying. Kill the carriers before they launch — then hunt the missiles in the dark."
faction = "US"
kind = "scenario"
photo = ["Tu-95MS", "E-3A"]
photo_caption = "BEAR H — carrier of the AS-15 cruise missile (file photograph)"
era = "1980s"
difficulty = 4
order = 40
theater = "alaska"
start = "1986-02-20T09:30:00"
tz = "Z"
duration_min = 100
seed = 1986
reliability = 4.0

briefing = """
ALASKAN NORAD REGION — ROCC ELMENDORF. THIS SCENARIO IS HYPOTHETICAL.

SITUATION. After a week of crisis the Soviet Union has dispersed its bomber force. Intelligence expects BEAR H regiments from Anadyr to attack Alaska's air bases with AS-15 cruise missiles to open a path for the main strike against the continental United States. The missiles are small, fly at about 60 metres following the ground, and are invisible to ground radars beyond a few dozen kilometres. Only the AWACS and the Eagles' look-down radars can see them.

FORCES. Two E-3A Sentries airborne (DARKSTAR, SENTRY 2). F-15A Eagles at Galena, King Salmon and Elmendorf. AN/FPS-117 radars on the west coast.

RULES OF ENGAGEMENT. DEFCON 2, ADW YELLOW, weapons TIGHT. Expect the Region to declare an air defense emergency: from then on Soviet aircraft in the ADIZ are hostile.

TASKS.
  • Destroy the carriers before they reach their launch points.
  • Destroy cruise missiles before they reach Anchorage, Fairbanks and the forward bases.
  • Keep the AWACS alive and the Eagles fuelled.
  • A Korean Air cargo 747 is still inbound to Anchorage. Do not shoot it down.
"""

[[intel]]
title = "Cruise missiles"
text = "AS-15 (Kh-55): radar cross-section about a tenth of a square metre, 750 km/h, 50-100 m above the terrain. Ground radars see them only near the coast. Put an Eagle above the expected track and let its APG-63 look down."

[[intel]]
title = "Jamming"
text = "A BADGER is expected to orbit near St. Lawrence Island with noise jammers against the coastal radars. Triangulate it; it is a legitimate target once the emergency is declared."

