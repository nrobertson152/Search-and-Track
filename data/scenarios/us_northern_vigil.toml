id = "us_northern_vigil"
title = "Northern Vigil"
subtitle = "Bangor Air Defense Sector, 24 October 1962"
summary = "A night shift at the height of the Cuban Missile Crisis: routine traffic, stragglers off their flight plans, a Soviet Bear probing the coast — and something else on the scopes."
faction = "US"
kind = "scenario"
photo = ["Tu-95M", "F-106A"]
photo_caption = "BEAR escorted off the Atlantic coast (file photograph)"
era = "1960s"
difficulty = 3
order = 10
theater = "gulf_of_maine"
start = "1962-10-24T22:30:00"
tz = "Z"
duration_min = 120
seed = 1962
reliability = 3.0

briefing = """
DIRECTION CENTER DC-05, TOPSHAM AFS — NIGHT SHIFT, 24 OCTOBER 1962

SITUATION. The quarantine of Cuba is in force. Strategic Air Command went to DEFCON 2 today; Air Defense Command is at DEFCON 3 with interceptors dispersed and armed. Air Defense Warning is YELLOW. Weapons status is HOLD: no engagement without the authority of 26th NORAD Region.

YOUR SECTOR. Long-range radars at Charleston, Bucks Harbor, Caswell, North Truro, St. Albans and Texas Tower 2, plus Pinetree stations at Barrington and St. Margarets, feed the AN/FSQ-7. Interceptors: 75th FIS (F-101B, Dow), 27th FIS (F-106A, Loring), F-106 detachment at Otis. Army Nike Hercules batteries defend Loring and Boston through the AADCP; BOMARC at Dow (nuclear — requires release).

TASKS.
  • Identify every track penetrating the ADIZ within five minutes (NORAD tolerances: ±5 min, 20 nm over water / 10 nm over land of a filed flight plan).
  • Intercept and visually identify unknowns. Keep aircraft off the coast until identified.
  • Do not escalate on bad information. The Region will hold you accountable for every request you make.
  • Keep interceptors on alert for the next shift.

It is night: visual identification requires a close, slow approach.
"""

[[intel]]
title = "Soviet long-range aviation"
text = "Tu-95 BEAR reconnaissance flights have been reported off Newfoundland this week. Expect probing of the ADIZ. Bears carry ECM; jamming strobes from several radars can be triangulated into a jammer track. Peacetime rules: intercept, identify, escort — weapons HOLD."

[[intel]]
title = "SIF codes in effect"
text = "Mode 1 codes valid this period: 23 and 41. Aircraft replying on other Mode 1 codes are not authenticated and must be treated as UNKNOWN until identified."

[[intel]]
title = "Propagation"
text = "Weather office warns of a strong temperature inversion forming over the Gulf of Maine after 2330Z. Expect anomalous propagation on coastal radars: false returns, ranges far beyond normal, no height-finder confirmation."

