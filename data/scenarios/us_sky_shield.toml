id = "us_sky_shield"
title = "Sky Shield"
subtitle = "Bangor Air Defense Sector, exercise night, October 1961"
summary = "The whole continent has gone quiet: every civil aircraft is grounded while Strategic Air Command and the RAF throw their bombers at NORAD. The kills are simulated, the jamming is real, and the generals are counting."
faction = "US"
kind = "scenario"
photo = ["B-52G", "F-101B"]
photo_caption = "B-52 attacking under an F-101B during an air defense exercise (file photograph)"
era = "1960s"
difficulty = 3
order = 5
theater = "gulf_of_maine"
start = "1961-10-14T05:00:00"
tz = "Z"
duration_min = 110
seed = 1961
reliability = 2.5
exercise = true

briefing = """
DIRECTION CENTER DC-05, TOPSHAM AFS — EXERCISE NIGHT

SITUATION. Exercise SKY SHIELD is in progress across North America. All civil flights in the United States and Canada are grounded for the duration. Strategic Air Command B-52s and B-47s, and Royal Air Force Vulcans, will attack the sector as the enemy. They do not squawk, they jam, and some of them will come in very low.

EXERCISE RULES. Raiders are FAKERS. Identify them as FAKER and engage under exercise rules: an interceptor in a firing position, or a missile battery tracking to intercept, scores a simulated kill. Nobody fires anything that explodes. A raider that reaches its target unengaged scores against us.

FORCES. Long-range radars at Charleston, Bucks Harbor, Caswell, North Truro, St. Albans and Texas Tower 2, Pinetree stations at Barrington and St. Margarets, gap fillers at Mount Desert and Boothbay. 75th FIS (F-101B, Dow), 27th FIS (F-106A, Loring), F-106 detachment at Otis. Nike Hercules batteries for Boston and Loring through the AADCP.

TASKS.
  • Score simulated kills: the Region expects at least six.
  • Keep the raiders off Boston and Loring.
  • One mercy flight is exempted from the grounding: identify it and do not attack it.
  • Hand the next shift interceptors on alert.

Watch the low approaches: the B-47 crews know where our radars cannot see.
"""

[[intel]]
title = "Red force"
text = "Expect B-52G cells at high altitude behind barrage jamming from the east, B-47s at low level over the Gulf of Maine, and RAF Vulcans very high from the northeast. Jamming strobes from two or more radars can be triangulated into jammer tracks."

[[intel]]
title = "Grounding exemption"
text = "EASTERN 609, a Lockheed Super Constellation, is cleared Boston to Halifax on an organ-transport mercy flight, Mode 1 code 41, filed flight plan. It is the only civil aircraft authorized aloft."

