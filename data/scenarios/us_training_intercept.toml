# ---------------------------------------------------------------- instructor
# Each [[lesson]] step is pinned to the display on the instructor's card. The
# controls named in `highlight` are circled; `console` and `mode` point at the
# console tab and display to open; `mark` rings an aircraft or site on the
# display. The next step appears when `done` holds.

[[lesson]]
title = "The situation display"
text = "This is the SAGE situation display. Radar returns that the computer has not yet tied to a track show as small dots. The exercise target, a KC-135 with its IFF switched off, will come in from the east over the Gulf of Maine. The amber circle shows where."
action = "When its return appears, click it with the light gun, then press INITIATE TRACK (I)"
mode = "map"
console = "TRACKS"
highlight = ["INITIATE TRACK (I)", "INITIATE (I)"]
mark = "target"
mark_label = "EXERCISE TARGET"
done = { type = "tracked", ac = "target" }

[[lesson]]
title = "Get a height"
text = "The computer now holds a track. Search radars measure range and bearing, not altitude. Height requests queue on the nearest free AN/FPS-6, which nods its beam up and down through the target."
action = "TRACKS F1: select the track, press HEIGHT (H)"
console = "TRACKS"
highlight = ["HEIGHT (H)", "TABLE tracks"]
mark = "target"
done = { type = "height", ac = "target", src = ["HF"] }

[[lesson]]
title = "Identify"
text = "No IFF reply, and no flight plan correlates with it. Air Defense Command calls that an UNKNOWN, and an unknown inside the ADIZ must be identified by eye."
action = "TRACKS F1: press UNKNOWN"
console = "TRACKS"
highlight = ["UNKNOWN"]
done = { type = "identity", ac = "target", is = ["unknown", "faker"] }

[[lesson]]
title = "Scramble"
text = "Dow AFB keeps F-101B Voodoos of the 75th FIS on five-minute alert. Commit a pair for an identification pass: the computer brings them up behind the target, where the pilots can read its markings."
action = "WEAPONS F2: ×2, ID PASS, STERN, then SCRAMBLE ON the track"
console = "WEAPONS"
highlight = ["×2", "ID PASS", "STERN", "SCRAMBLE*"]
mark = "dow"
mark_label = "DOW AFB · 75th FIS"
done = { type = "scrambled", n = 1 }

[[lesson]]
title = "Fly the intercept"
text = "Alert aircraft need three or four minutes to get airborne. The X on the display is the predicted intercept point. The Voodoo is voice controlled, so every vector reaches the pilot seconds after you give it. Speed up time while they climb; the clock slows itself for alerts."
action = "Press 8× (or +) and watch the flight close on the X"
highlight = ["8×", "TABLE fl"]
mark = "target"
done = { type = "vid", ac = "target" }

[[lesson]]
title = "Re-identify"
text = "The pilots read the tail: a USAF KC-135, the exercise target. Their report is in COMMS. Re-identify the track. An exercise aircraft simulating an enemy is a FAKER; a FRIEND is also correct."
action = "TRACKS F1: press FRIEND or FAKER"
console = "TRACKS"
highlight = ["FRIEND", "FAKER"]
done = { type = "identity", ac = "target", is = ["friend", "faker"] }

[[lesson]]
title = "Recover the flight"
text = "Bring the Voodoos home before their fuel runs low. An interceptor that runs dry is lost, however well the intercept went."
action = "WEAPONS F2: select the flight, press RTB"
console = "WEAPONS"
highlight = ["RTB", "TABLE fl"]
done = { type = "any", of = [{ type = "flight", state = "rtb" }, { type = "flights_home" }] }

[lesson_end]
title = "Lesson complete"
text = "That is the core loop of the weapons room: detect, track, get a height, identify, commit, identify by eye, recover. Next: Jamming and the Radar Scope."
reason = "Lesson complete"

[[objective]]
id = "track"
text = "Initiate a track on the unknown"
kind = "identify"
params = { ac = "target", correct = ["pending", "unknown", "faker", "friend"], from = "track" }
points = 10

[[objective]]
id = "ident"
text = "Identify the target as UNKNOWN before the fighters launch"
kind = "identify"
params = { ac = "target", correct = ["unknown", "faker", "friend"], wrong = ["hostile"] }
points = 20

[[objective]]
id = "vid"
text = "Obtain a visual identification before the target crosses the coast"
kind = "vid"
params = { ac = "target" }
points = 40

[[objective]]
id = "nofrat"
text = "Do not fire on friendly aircraft"
kind = "no_fratricide"
points = 10
penalty = 50

[[objective]]
id = "nociv"
text = "No civil aircraft losses"
kind = "no_civil_losses"
points = 10
penalty = 100

[[objective]]
