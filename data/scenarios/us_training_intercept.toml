briefing = """
DIRECTION CENTER DC-05, TOPSHAM AFS — TRAINING SHIFT

You are the Senior Director. An exercise target (a KC-135 flying with its IFF switched off) will approach the sector from the east over the Gulf of Maine. Treat it as a genuine UNKNOWN.

Your instructor's card is pinned to the situation display. It tells you what to do next and circles the controls to use:
  1. INITIATE the track with the light gun (click the return, then INITIATE).
  2. Request a HEIGHT from a height finder.
  3. Set the identity to UNKNOWN.
  4. SCRAMBLE a pair from Dow AFB and commit them for an identification pass.
  5. Get a visual identification, re-identify the track, then send the fighters home.

Surveillance and identification automation are switched OFF for this lesson so you do the work yourself.
"""

