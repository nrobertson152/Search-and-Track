id = "us_training_jamming"
title = "Training: Jamming and the Radar Scope"
subtitle = "Bangor Air Defense Sector — instructor-led"
summary = "Read raw radar video, find a jammer by its strobes, beat a spot jammer by changing frequency, and identify the bomber behind the noise."
faction = "US"
kind = "training"
photo = ["B-47E", "F-101B"]
photo_caption = "B-47E Stratojet of Strategic Air Command, ECM aggressor for the exercise"
era = "1960s"
difficulty = 1
order = 2
theater = "gulf_of_maine"
start = "1960-09-08T14:00:00"
tz = "Z"
duration_min = 60
seed = 1960
reliability = 50.0
exercise = true

briefing = """
DIRECTION CENTER DC-05, TOPSHAM AFS — TRAINING SHIFT, ELECTRONIC COUNTERMEASURES

Strategic Air Command has lent us a B-47E with a spot noise jammer aboard. It will come up from the south over the Gulf of Maine and try to hide in its own noise while it runs on Bangor. It is an exercise aircraft playing the enemy: a FAKER.

What you will learn:
  1. The radar scope: raw video, sweep by sweep, before the computer has interpreted it.
  2. Jamming strobes, and how bearings from two sites make a jammer track.
  3. Spot jamming is narrow: change your radar's frequency channel and the jammer has to hunt for you again.
  4. One spot jammer, two radars: put them on different channels and the jammer cannot cover both.

The instructor's card is pinned to the display. Surveillance automation is ON, identification is yours.
"""

