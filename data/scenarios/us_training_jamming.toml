# ---------------------------------------------------------------- instructor
[[lesson]]
title = "Raw video"
text = "The situation display shows what the computer has made of the radar data. The scope shows the data itself: every echo, every patch of clutter and every watt of jamming, painted sweep by sweep on a long-persistence tube."
action = "Press M, or the RADAR SCOPE key, to see the raw video"
mode = "scope"
highlight = ["RADAR SCOPE"]
done = { type = "ui", event = "mode_scope" }

[[lesson]]
title = "The strobe"
text = "The bright spoke is a jamming strobe. Noise fills every range cell on the jammer's bearing, so you know its direction but not its range. Each radar hears the jammer on its own bearing. Look at both sites."
action = "Step between Charleston and Bucks Harbor with < and > (or , and .)"
mode = "scope"
highlight = ["<", ">"]
mark = "tophat"
mark_label = "JAMMER"
done = { type = "all", of = [{ type = "ui", event = "scope_charleston" }, { type = "ui", event = "scope_bucks_harbor" }] }

[[lesson]]
title = "Triangulation"
text = "Where strobes from two sites cross, the computer builds a jammer track. It has no height, and its range is only as good as the crossing angle, but it is something to commit fighters against. Jammer tracks are marked with a J."
action = "Wait for the JAMMING alert, then select the jammer track on TRACKS F1"
console = "TRACKS"
highlight = ["TABLE tracks"]
mark = "tophat"
mark_label = "JAMMER"
done = { type = "tracked", ac = "tophat" }

[[lesson]]
title = "Identify the faker"
text = "The bomber is SAC's, playing the enemy for the exercise. An exercise aircraft simulating a hostile is a FAKER."
action = "TRACKS F1: select the jammer track, press FAKER"
console = "TRACKS"
highlight = ["FAKER", "TABLE tracks"]
mark = "tophat"
mark_label = "JAMMER"
done = { type = "identity", ac = "tophat", is = ["faker"] }

[[lesson]]
title = "Change frequency"
text = "A spot jammer puts all its power on one radar channel: strong, but narrow. Move one of the jammed radars to its other channel. The jammer can only sit on one channel at a time, and it hunts for the nearest radar. The FPS-6 height finders work in another band and are not jammed at all."
action = "RADAR F4: select a jammed site, click the FREQ CHANNEL knob"
console = "RADAR"
highlight = ["FREQ CHANNEL", "TABLE radars"]
done = { type = "any", of = [{ type = "site", site = "charleston", attr = "channel", op = "!=", value = 0 }, { type = "site", site = "bucks_harbor", attr = "channel", op = "!=", value = 0 }] }

[[lesson]]
title = "Skin paint"
text = "With your two radars on different channels the jammer can cover only one of them. The clean site paints the bomber's echo, and the computer starts a new track on it, with a speed and a heading this time. The jammer track fades when its strobes stop crossing. Identify the new track."
action = "TRACKS F1: select the new track on the bomber, press FAKER"
console = "TRACKS"
highlight = ["FAKER", "TABLE tracks"]
mark = "tophat"
mark_label = "TOP HAT 21"
done = { type = "identity", ac = "tophat", is = ["faker"], skin = true }

[[lesson]]
title = "Commit"
text = "Send a pair of Voodoos from Dow for an identification pass on the skin track. Keep the radars on different channels and the track will hold."
action = "WEAPONS F2: ×2, ID PASS, STERN, then SCRAMBLE ON the track"
console = "WEAPONS"
highlight = ["×2", "ID PASS", "STERN", "SCRAMBLE ON*"]
mark = "dow"
mark_label = "DOW AFB · 75th FIS"
done = { type = "scrambled", n = 1 }

[[lesson]]
title = "The intercept"
text = "Watch the scope: the strobe stays on the site the jammer is hunting, the echo shows on the other. Close in, the echo would beat the noise anyway: it grows with the inverse fourth power of range, the noise with the square. Speed up time while the fighters climb."
action = "Press 8× (or +) and watch the flight close"
highlight = ["8×", "TABLE fl"]
mark = "tophat"
mark_label = "TOP HAT 21"
done = { type = "vid", ac = "tophat" }

[[lesson]]
title = "Recover the flight"
text = "Visual identification complete: a SAC B-47, the faker. Bring the fighters home."
action = "WEAPONS F2: select the flight, press RTB"
console = "WEAPONS"
highlight = ["RTB", "TABLE fl"]
done = { type = "any", of = [{ type = "flight", state = "rtb" }, { type = "flights_home" }] }

[lesson_end]
title = "Lesson complete"
text = "Jamming hides a bomber's range, not its bearing. Cross the strobes, spread your radars across their channels, and the bomber shows. Next: Rules of Engagement."
reason = "Lesson complete"

