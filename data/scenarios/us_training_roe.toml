# ---------------------------------------------------------------- instructor
[[lesson]]
title = "Exercise rules"
text = "Today's exercise has two kinds of target. FAKERs are SAC bombers playing the enemy: you may engage them, and the umpires score simulated kills. Everything else is real. The first faker is coming in from the north-east toward Loring."
action = "TRACKS F1: select its track, press FAKER"
mode = "map"
console = "TRACKS"
highlight = ["FAKER", "TABLE tracks"]
mark = "faker1"
mark_label = "BUZZER 31"
done = { type = "identity", ac = "faker1", is = ["faker"] }

[[lesson]]
title = "The Nike batteries"
text = "The Army's Nike Hercules batteries defend Loring. The AADCP passes them targets from your tracks, then each battery's own radars lock on. It accepts a target within about 300 km of the battery; the battery fires inside about 140 km, and holds fire while friendly fighters are near the target."
action = "MISSILES F3: select Nike L-13 or L-58, then DESIGNATE the faker's track"
console = "MISSILES"
highlight = ["TABLE sams", "DESIGNATE*"]
mark = "nike_l58"
mark_label = "NIKE L-58"
done = { type = "any", of = [{ type = "site", site = "nike_l13", attr = "assigned", op = "!=", value = "" }, { type = "site", site = "nike_l58", attr = "assigned", op = "!=", value = "" }] }

[[lesson]]
title = "Simulated engagement"
text = "The battery acquires the faker on its own radars and fires when it comes within range. In an exercise the umpires assess the kill and the bomber flies on, scored dead. A miss leaves the battery waiting for orders unless re-engagement is automatic."
action = "MISSILES F3: switch AUTO RE-ENG on, then press 8× (or +) and watch"
console = "MISSILES"
highlight = ["AUTO RE-ENG", "8×"]
mark = "faker1"
mark_label = "BUZZER 31"
done = { type = "sim_killed", ac = "faker1" }

[[lesson]]
title = "An unknown"
text = "A slow return without IFF is coming in from the sea toward Portland. Nobody has seen it, so it is not a faker: it is an UNKNOWN, and exercise rules do not cover it."
action = "TRACKS F1: select the new track, press UNKNOWN"
console = "TRACKS"
highlight = ["UNKNOWN", "TABLE tracks"]
mark = "lost"
mark_label = "UNKNOWN"
done = { type = "identity", ac = "lost", is = ["unknown"] }

[[lesson]]
title = "Higher authority"
text = "Only 26th Air Division can declare a track HOSTILE while weapons are on HOLD. Ask them, and see what they want before they will."
action = "COMMS F6: with the unknown selected, press HOSTILE"
console = "COMMS"
highlight = ["HOSTILE*"]
done = { type = "request", kind = "declare_hostile", answered = true }

[[lesson]]
title = "Go and look"
text = "Higher authority wants evidence: a visual identification, an active jammer, or a hostile act. Send a pair of Voodoos for an identification pass. Weapons stay on HOLD."
action = "WEAPONS F2: ×2, ID PASS, then SCRAMBLE ON the unknown"
console = "WEAPONS"
highlight = ["×2", "ID PASS", "SCRAMBLE ON*"]
mark = "dow"
mark_label = "DOW AFB · 75th FIS"
done = { type = "scrambled", n = 1 }

[[lesson]]
title = "Tally"
text = "A slow, low target is hard to find: the fighters must slow down and come in behind it. Speed up time while they fly."
action = "Press 8× (or +) and watch the flight close"
highlight = ["8×", "TABLE fl"]
mark = "lost"
done = { type = "vid", ac = "lost" }

[[lesson]]
title = "A lost pilot"
text = "The pilots report a Cessna 172, civil registration N7413K, with a dead transponder: a private pilot lost over the water. Re-identify the track FRIEND and the controllers will talk him down at Portland."
action = "TRACKS F1: press FRIEND"
console = "TRACKS"
highlight = ["FRIEND"]
done = { type = "identity", ac = "lost", is = ["friend"] }

[[lesson]]
title = "Recover the flight"
text = "Bring the Voodoos home."
action = "WEAPONS F2: select the flight, press RTB"
console = "WEAPONS"
highlight = ["RTB", "TABLE fl"]
done = { type = "any", of = [{ type = "flight", state = "rtb" }, { type = "flights_home" }] }

[lesson_end]
title = "Lesson complete"
text = "Exercise rules covered the faker. Everything else needed a positive identification first, and higher authority wanted evidence before it would call anything hostile. That is the whole of the rules of engagement."
reason = "Lesson complete"

