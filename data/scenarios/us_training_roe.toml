briefing = """
DIRECTION CENTER DC-05, TOPSHAM AFS — EXERCISE SHIFT

An air defense exercise is running over the Loring Defense Area. SAC bombers playing the enemy are FAKERs: under exercise rules you may engage them, and the kills are simulated and scored by the umpires. Everything that is not a faker is real.

What you will learn:
  1. Exercise rules: who may be engaged, and who may not.
  2. The Nike Hercules batteries: designating a target through the Army Air Defense Command Post.
  3. Higher authority: what it takes to have a track declared HOSTILE.
  4. Identification before engagement, always.

The instructor's card is pinned to the display. Surveillance automation is ON, identification is yours.
"""

