# Warship classes for battle missions. Ships are not radar targets of the air picture:
# surface contacts are found by the battle's sensor model (radar horizon, ESM).
# radars: shipboard radars feed the owning side's air picture like any other radar site.
# sams: one entry per fire channel (illuminator / guidance radar); missiles per channel.
# hp: damage the hull absorbs; a 1000 kg warhead does about 90.
# provenance: historical | approximate | fictional.

