[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "searchtrack"
version = "0.1.0"
description = "Search and Track: a Cold War air-defense command simulator"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "pygame-ce>=2.4",
  "numpy>=1.24",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "h5py>=3"]

[project.scripts]
searchtrack = "searchtrack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
